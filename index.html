<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>くぎだまディフェンス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Kiwi+Maru:wght@500&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: 台を画面いっぱいに（横はぴったり、上下のあまりは木のフレーム）。お金（コイン）・ライフのバー・WAVE は台の上の角に枠なしで、
   ハンドル（強さ）は右下に重ねて出す。見た目は「ネオンな夜の草原」：木のフレームに草とつる、光る木の実 */
:root{
  --night:#0b1222; --panel:#16201f; --deep:#0c1412; --line:#3a4a3a; --frame:#2a1a0f;
  --ink:#f1f3e4; --dim:#a3b0a0;
  --fire:#c6ff4f; --moon:#f3e6b5; --leaf:#7cdc8a; --wood:#a67a50; --berry:#ff8f7e;
  --neon-pink:#ff5fd2; --neon-cyan:#4ff0ff;
  --glass:rgba(22,14,8,.72);
  --f-disp:"Kiwi Maru","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-arc:"Bungee","M PLUS Rounded 1c",sans-serif;
  --arc-bg:#0c0918; --neon-p:#ff4fd8; --neon-c:#3ef2ff; --neon-y:#ffd84a;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--frame)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--frame);color:var(--ink);font-family:var(--f-body);font-size:14px;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
canvas{position:absolute;inset:0;display:block;touch-action:none}

/* 台の上に重ねる表示：枠なし。左上にお金（コイン）、右上にWAVEと音。ライフは台の下の受け皿のバー（canvas） */
.hud{position:absolute;z-index:2;top:8px;left:max(10px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
  text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.6)}
.coin{display:inline-block;flex:none;width:1em;height:1em;border-radius:50%;vertical-align:-.12em;
  background:radial-gradient(circle at 34% 30%,#fff6c2 0 14%,#ffd84a 42%,#d79a12 100%);
  box-shadow:inset 0 0 0 .1em rgba(150,96,6,.55),inset 0 0 0 .2em rgba(255,240,170,.35),0 0 .5em rgba(255,216,74,.45)}
.money{display:flex;align-items:center;gap:6px;font-size:19px}
.money b{font-size:22px;font-weight:800;line-height:1;color:#ffe27a;font-variant-numeric:tabular-nums;transition:color .2s}
.money.empty b{color:var(--berry)}
.hud-r{display:flex;align-items:center;gap:8px}
.wave{font:800 15px var(--f-body);color:var(--fire);letter-spacing:.04em;line-height:1}
.snd{pointer-events:auto;width:30px;height:30px;margin:-7px -4px -7px 0;padding:6px;border:0;background:transparent;color:var(--ink);cursor:pointer;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
.snd svg{width:100%;height:100%;display:block}
.snd .sx{display:none} .snd[aria-pressed="false"] .sx{display:inline} .snd[aria-pressed="false"] .sw{display:none}
.snd[aria-pressed="false"]{color:var(--dim)}

/* 台の下：右にハンドルだけ */
.bottom{position:absolute;z-index:2;left:max(8px,env(safe-area-inset-left,0px));right:max(4px,env(safe-area-inset-right,0px));bottom:2px;
  display:flex;justify-content:flex-end;align-items:flex-end;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink);background:var(--deep);font:700 11px var(--f-body)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:inset 0 -2px 0 rgba(0,0,0,.28);flex:none}
.dot.big{width:14px;height:14px}
.num{font-variant-numeric:tabular-nums}

/* ハンドル：本物の台のように右下の丸いダイヤル。回すと強さだけが変わる（玉はずっと出ている） */
.handle{pointer-events:auto;display:flex;align-items:flex-end;touch-action:none;cursor:grab;outline:none}
.handle:focus-visible .dial{outline:2px solid var(--fire);outline-offset:4px}
.dial{width:72px;height:72px;margin:9px;border-radius:50%;position:relative;flex:none;border:3px solid #7a5232;
  background:radial-gradient(circle at 40% 32%,#6a4a2e,#3a2616 72%);box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 -4px 0 rgba(0,0,0,.25)}
.ring{position:absolute;inset:-9px;border-radius:50%;--p:.5;
  background:conic-gradient(from 225deg,var(--fire) 0deg,var(--neon-cyan) calc(var(--p)*270deg),rgba(255,255,255,.14) calc(var(--p)*270deg) 270deg,transparent 270deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.dial::after{content:"";position:absolute;inset:12px;border-radius:50%;border:1px dashed rgba(243,230,181,.32)}
.dial-knob{position:absolute;left:50%;top:50%;width:5px;height:26px;margin-left:-2.5px;margin-top:-26px;border-radius:3px;background:var(--moon);box-shadow:0 0 6px rgba(243,230,181,.6);transform-origin:50% 100%}
.dial-lbl{position:absolute;bottom:-8px;font-size:10px;font-weight:800;color:var(--ink);text-shadow:0 1px 2px #000}
.dial-lbl.l{left:2px} .dial-lbl.r{right:2px}
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(8,12,22,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.panel{width:100%;max-width:440px;max-height:100%;overflow:auto;border:1.5px solid var(--line);border-radius:20px;background:var(--panel);padding:18px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.logo{font-family:var(--f-disp);font-weight:500;line-height:1;text-align:center;margin:6px 0 0}
.logo .a{display:block;font-size:clamp(44px,15vw,64px);color:var(--moon);text-shadow:0 0 24px rgba(216,242,106,.35)}
.logo .b{display:block;font-size:clamp(20px,7vw,30px);color:var(--leaf);letter-spacing:.12em;margin-top:8px}
#title .panel{max-width:340px;gap:30px;padding:34px 22px 26px}
#startBtn{font-size:20px;padding:15px 16px;letter-spacing:.25em;animation:startGlow 1.8s ease-in-out infinite}
@keyframes startGlow{50%{box-shadow:0 0 26px rgba(216,242,106,.55)}}
@media (prefers-reduced-motion:reduce){#startBtn{animation:none}}
.btnrow{display:flex;flex-direction:column;gap:8px}
.btn{font:800 16px var(--f-body);padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--fire);border-color:var(--fire);color:var(--night);box-shadow:0 4px 14px rgba(216,242,106,.22)}
.btn:focus-visible,.buy:focus-visible,.chip:focus-visible{outline:2px solid var(--fire);outline-offset:2px}
h2{font-family:var(--f-disp);font-weight:500;font-size:26px;margin:0;text-align:center;color:var(--moon);text-wrap:balance}
h3{font-size:13px;margin:0 0 8px;color:var(--leaf);letter-spacing:.04em}
h3 small{color:var(--dim);font-weight:500;margin-left:4px}
.lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;text-align:center;font-size:15px}
.purse{margin:0;text-align:center;color:var(--dim)} .purse b{font:800 22px var(--f-body);color:#ffe27a;margin-left:5px;font-variant-numeric:tabular-nums}
.purse .coin{font-size:20px;margin-left:4px} .buy .coin{margin-right:4px} .d .coin,.lines .coin,small .coin{margin:0 2px 0 1px}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--deep)}
.item>div{min-width:0}
.item .t{font-weight:800} .item .d{font-size:12px;color:var(--dim);line-height:1.45}
.item.locked{opacity:.55}
.trow{grid-template-columns:44px 1fr auto;padding:7px 10px 8px 6px}
.tico{width:44px;height:44px}
.tinfo{display:flex;flex-direction:column;gap:10px}
.gauges{display:flex;flex-direction:column;gap:6px}
.gauges.mini{flex-direction:row;flex-wrap:wrap;gap:3px 7px;margin-top:3px}
.gg{display:flex;align-items:center;gap:8px}
.gl{font:800 12px var(--f-body);color:var(--dim);white-space:nowrap}
.pips{display:flex;gap:4px}
.pips i{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);box-sizing:border-box}
.pips i.on{background:var(--tc);border-color:var(--tc);box-shadow:0 0 6px var(--tc)}
.pips i.up{background:#ffd84a;border-color:#fff3b0;box-shadow:0 0 7px #ffd84a}
.mini .gg{gap:4px} .mini .gl{font-size:10px} .mini .pips{gap:2px} .mini .pips i{width:7px;height:7px;border-width:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{position:relative;overflow:hidden;padding:3px 10px 4px;border-radius:99px;border:1.5px solid var(--c);color:#fff;font:800 12px var(--f-body);background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 8px color-mix(in srgb,var(--c) 45%,transparent)}
.tg i{position:absolute;left:0;bottom:0;height:2px;background:var(--c)}
.trow .tags{margin-top:4px} .trow .tg{padding:1px 8px 2px;font-size:10px}
.xpbar{display:flex;align-items:center;gap:8px}
.xpbar .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.xpbar .bar i{display:block;height:100%;border-radius:99px;background:var(--tc);box-shadow:0 0 8px var(--tc)}
.xpbar b{font:800 11px var(--f-body);color:var(--ink);white-space:nowrap}
.hint{margin:0;font-size:12px;color:var(--dim)} .hint b{color:var(--ink)}
.buy{font:700 13px var(--f-body);padding:8px 10px;border-radius:10px;border:1.5px solid var(--moon);color:var(--moon);background:transparent;white-space:nowrap;cursor:pointer}
.buy:disabled{opacity:.35;cursor:not-allowed}
.buy.owned{border-color:var(--line);color:var(--dim);opacity:1}
/* ロビー（台えらび・お店・セット）：夜のゲームセンター。ネオンの看板と走る電球、じゅうたんの模様、下にタブ */
.hub{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(circle at 18% 8%,rgba(255,79,216,.13),transparent 42%),radial-gradient(circle at 88% 72%,rgba(62,242,255,.1),transparent 46%),var(--arc-bg)}
.hub::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 10px 10px,rgba(255,216,74,.2) 0 1.2px,transparent 1.7px),radial-gradient(circle at 34px 30px,rgba(62,242,255,.18) 0 1.4px,transparent 1.9px),radial-gradient(circle at 27px 7px,rgba(255,79,216,.16) 0 1px,transparent 1.5px);
  background-size:44px 40px}
.hub-top{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sign{display:flex;flex-direction:column;gap:5px;line-height:1;min-width:0}
.sign b{font:500 27px var(--f-disp);color:#fff;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 10px var(--neon-p),0 0 22px var(--neon-p),0 0 40px rgba(255,79,216,.55)}
.wallet{flex:none;display:flex;align-items:center;gap:7px;padding:6px 13px 6px 8px;border-radius:99px;background:#07050f;border:1.5px solid rgba(255,216,74,.6);
  box-shadow:0 0 12px rgba(255,216,74,.25),inset 0 0 10px rgba(255,216,74,.12)}
.wallet .coin{font-size:20px}
.wallet b{font:400 18px var(--f-arc);color:var(--neon-y);text-shadow:0 0 8px rgba(255,216,74,.7);font-variant-numeric:tabular-nums}
.wallet.spend{animation:spend .45s ease-out}
@keyframes spend{0%{transform:scale(1.14);box-shadow:0 0 26px rgba(255,216,74,.7)}100%{transform:none}}
.bulbs{position:relative;flex:none;height:10px;margin:0 max(10px,env(safe-area-inset-left,0px)) 0 max(10px,env(safe-area-inset-right,0px));
  background:radial-gradient(circle at 7px 5px,#fff3c4 0 1.6px,#ffd84a 2.3px,transparent 3.1px) 0 0/14px 10px repeat-x;filter:drop-shadow(0 0 3px rgba(255,216,74,.9))}
.bulbs::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 7px 5px,rgba(22,14,4,.88) 0 3.2px,transparent 3.6px) 0 0/28px 10px repeat-x;animation:chase .8s steps(1) infinite}
@keyframes chase{50%{background-position-x:14px}}
.hub-body{position:relative;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding-block:14px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lead{margin:0;font-size:12px;line-height:1.55;color:#b9b2d6}
.lead b{color:#fff}
.sect{font:400 12px var(--f-arc);letter-spacing:.22em;color:var(--neon-c);text-shadow:0 0 6px rgba(62,242,255,.6);margin:4px 0 -4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.card:not(.row) .mid{display:contents}
.card.row{flex-direction:row;align-items:center;gap:12px;padding:9px 12px 9px 9px;text-align:left;background:linear-gradient(90deg,var(--cs),rgba(10,8,22,.94) 42%)}
.card.row:active{transform:scale(.98)}
.card.row .ico{flex:none;width:64px;aspect-ratio:1}
.card.row .ico img{width:92%}
.card.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card.row .ds{min-height:0}
.card.row .price,.card.row .tagown{flex:none;margin:0}
.card.row .tagown{padding:4px 10px;font-size:11px}
.card.row .cnt{top:auto;bottom:5px;right:auto;left:44px}
.card{--c:#ff4fd8;--cg:rgba(255,79,216,.35);--cs:rgba(255,79,216,.14);position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;
  padding:8px 9px 12px;border-radius:16px;border:1.5px solid var(--c);background:linear-gradient(180deg,var(--cs),rgba(10,8,22,.94) 58%);
  box-shadow:0 0 14px var(--cg),inset 0 0 0 1px rgba(255,255,255,.04);color:var(--ink);font:inherit;text-align:center;cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.96)}
.card:focus-visible,.cab:focus-visible,.tabs button:focus-visible,.socket:focus-visible,.nbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.card .ico{width:100%;aspect-ratio:5/4;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle at 50% 56%,var(--cs),rgba(5,3,12,.75) 72%)}
.card .ico img{width:84%;max-width:118px;height:auto}
.card .nm{font:800 15px var(--f-body);line-height:1.2}
.card .ds{font-size:11px;line-height:1.4;color:#a59fc4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.price{margin-top:5px;display:inline-flex;align-items:center;gap:5px;padding:5px 14px 4px;border-radius:99px;background:linear-gradient(180deg,#fff0a6,#ffc21f);color:#2a1800;
  font:400 15px var(--f-arc);box-shadow:0 3px 0 #a86f00,0 0 12px rgba(255,216,74,.45)}
.price .coin{font-size:14px}
.price.short{background:#262040;color:#8a83a8;box-shadow:0 3px 0 #120f24}
.tagown{margin-top:5px;padding:4px 12px;border-radius:99px;border:1.5px solid #5fff8a;color:#c8ffd6;font:800 12px var(--f-body);box-shadow:0 0 10px rgba(95,255,138,.35)}
.cnt{position:absolute;top:7px;right:7px;padding:2px 8px 1px;border-radius:99px;background:#07050f;border:1px solid var(--c);color:#fff;font:400 12px var(--f-arc)}
.setstrip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1.5px solid rgba(62,242,255,.55);background:rgba(10,8,22,.85);box-shadow:0 0 14px rgba(62,242,255,.18)}
.setstrip>span{font:800 12px var(--f-body);color:#cfe9ff;white-space:nowrap}
.minis{display:flex;gap:4px;flex:1;min-width:0}
.minis img{width:26px;height:26px}
.linkbtn{flex:none;padding:7px 12px;border-radius:99px;border:1.5px solid var(--neon-c);background:transparent;color:#dffbff;font:800 12px var(--f-body);cursor:pointer;box-shadow:0 0 10px rgba(62,242,255,.3)}
.stamp{position:absolute;z-index:1;top:10px;right:12px;padding:3px 10px 2px;border:2px solid #5fff8a;border-radius:8px;color:#d9ffe4;font:400 13px var(--f-arc);letter-spacing:.08em;transform:rotate(-7deg);text-shadow:0 0 8px #5fff8a;box-shadow:0 0 10px rgba(95,255,138,.5)}
/* 台のタブ＝パチンコ屋さんのホール：台が目の前に並び、左右にスワイプで台をかえる。イス（座る）をタップで台へ */
.hub-body>*{flex:none}
.hub-body.hall{overflow:hidden;padding-inline:0;padding-block:10px 12px;gap:10px}
.hub-body.hall>.setstrip{margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px));padding:7px 10px}
.hub-body.hall>.hallwrap{flex:1 1 auto;min-height:0}
.hallwrap{--cw:200px;--gap:20px;position:relative;display:flex;flex-direction:column}
.hallwrap::before{content:"";position:absolute;left:50%;top:-10px;bottom:0;width:calc(var(--cw)*2.4);max-width:100%;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse 50% 78% at 50% 0,rgba(255,236,190,.17),rgba(255,236,190,.05) 55%,transparent 72%)}
.hallwrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.5))}
.aisle{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:flex-end;gap:var(--gap);overflow-x:auto;overflow-y:hidden;padding-bottom:18px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.aisle::-webkit-scrollbar{display:none}
.aisle::before,.aisle::after{content:"";flex:0 0 max(0px,calc(50% - var(--cw)/2 - var(--gap)))}
.slot{flex:0 0 var(--cw);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;
  transform:scale(.86);opacity:.62;filter:saturate(.6) brightness(.75);transition:transform .3s,opacity .3s,filter .3s}
.slot.cur{transform:none;opacity:1;filter:none}
.cab{width:100%;display:flex;flex-direction:column;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:center}
.topper{position:relative;display:block;height:calc(var(--cw)*.22);border-radius:calc(var(--cw)*.1) calc(var(--cw)*.1) 6px 6px;
  border:2px solid var(--nc);background:linear-gradient(180deg,#261d40,#0c0918 85%);box-shadow:0 0 14px var(--ng),inset 0 0 12px var(--ng)}
.topper::after{content:"";position:absolute;left:9%;right:9%;bottom:7%;height:6px;opacity:.9;
  background:radial-gradient(circle at 4.5px 3px,#fff3c4 0 1.2px,var(--nc) 1.9px,transparent 2.6px) 0 0/9px 6px repeat-x}
.slot.cur .topper::after{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.35}}
.tno{position:absolute;top:8%;left:9%;font:400 calc(var(--cw)*.052)/1 var(--f-arc);color:var(--nc);opacity:.85}
.tname{position:absolute;inset:0 0 14%;display:grid;place-items:center}
.tname b{font:500 calc(var(--cw)*.13)/1 var(--f-disp);color:#fff;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 10px var(--nc),0 0 22px var(--nc)}
.tname small{font-size:.6em;margin-left:.08em}
.topper .stamp{top:-9px;right:-7px;font-size:calc(var(--cw)*.062);padding:2px 7px 1px}
.cframe{position:relative;display:block;margin-top:3px;padding:calc(var(--cw)*.055);border-radius:9px;
  background:linear-gradient(140deg,#5b5672,#25203a 28%,#14111f 55%,#3d3854 80%,#1c1829);
  box-shadow:0 0 0 1.5px var(--nc),0 0 18px var(--ng),inset 0 1px 0 rgba(255,255,255,.22)}
.cface{position:relative;display:block;width:100%;aspect-ratio:3/5;border-radius:4px;overflow:hidden;background-size:cover!important;background-position:center!important;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.cface::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.15) 0 16%,transparent 32%,transparent 68%,rgba(255,255,255,.07) 76%,transparent 84%)}
.shutter{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#5d5580;
  font:400 calc(var(--cw)*.09)/1.3 var(--f-arc);letter-spacing:.08em;background:repeating-linear-gradient(180deg,#25213a 0 18px,#17142a 18px 21px)}
.newb{color:#7ef0b0;font-weight:800;text-shadow:0 0 8px rgba(126,240,176,.55)}
.shutter.lockd{color:#a8f0d0;font:500 calc(var(--cw)*.07)/1.6 "Kiwi Maru",serif;letter-spacing:.02em;text-shadow:0 0 8px rgba(126,240,176,.6);
  background:repeating-linear-gradient(180deg,rgba(28,25,48,.86) 0 18px,rgba(12,10,24,.93) 18px 21px)}
.hallwrap.sit .slot.cur{transform:scale(1.3) translateY(6%);transition:transform .5s cubic-bezier(.55,0,.8,.3)}
.hallwrap.sit .slot:not(.cur){opacity:0}
.hub.sitting::after{content:"";position:absolute;inset:0;z-index:30;background:#05030b;opacity:0;animation:fadein .42s .14s forwards}
@keyframes fadein{to{opacity:1}}
.slot.cur .cframe{animation:glowp 1.6s ease-in-out infinite}
@keyframes glowp{50%{box-shadow:0 0 0 1.5px var(--nc),0 0 30px var(--ng),inset 0 1px 0 rgba(255,255,255,.22)}}
.cab:active .cframe{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){.slot.cur .cframe,.slot.cur .topper::after{animation:none}}
.tray{display:flex;flex-direction:column;gap:10px;padding:14px 12px 12px;border-radius:18px;border:1.5px solid rgba(62,242,255,.6);background:linear-gradient(#140f28,#0a0716);box-shadow:0 0 16px rgba(62,242,255,.2)}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.socket{position:relative;aspect-ratio:1;max-width:100%;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.14);background:radial-gradient(circle at 50% 60%,#05030b,#1d1636);display:grid;place-items:center;cursor:pointer}
.socket img{width:92%;height:auto}
.socket .x{position:absolute;top:-2px;right:-2px;width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:#ff4f6d;color:#fff;font:800 11px/1 var(--f-body);box-shadow:0 0 8px rgba(255,79,109,.7)}
.socket.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.25);box-shadow:0 0 22px var(--neon-c)}100%{transform:none}}
.tray .lead{text-align:center}
.empty{padding:18px 14px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.18);text-align:center;color:#a59fc4;font-size:13px;line-height:1.6;display:flex;flex-direction:column;align-items:center;gap:10px}
.tabs{position:relative;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-block:6px 8px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,#120d24,#07050f);border-top:1.5px solid rgba(255,79,216,.55);box-shadow:0 -6px 18px rgba(255,79,216,.18)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;border:0;border-radius:12px;background:none;color:#8f88b0;font:800 11px var(--f-body);cursor:pointer}
.tabs svg{width:25px;height:25px;display:block}
.tabs button.on{color:#fff;background:radial-gradient(ellipse at 50% 100%,rgba(255,79,216,.38),transparent 72%);text-shadow:0 0 8px var(--neon-p)}
.tabs button.on svg{filter:drop-shadow(0 0 5px var(--neon-p))}
.toast{position:absolute;z-index:8;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:9px 16px;border-radius:14px;background:rgba(7,5,15,.95);
  border:1.5px solid var(--neon-c);color:#fff;font:800 13px var(--f-body);text-align:center;line-height:1.45;box-shadow:0 0 16px rgba(62,242,255,.35);animation:toast .25s ease-out}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}}
.buysheet{position:absolute;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.buy-back{position:absolute;inset:0;background:rgba(4,2,10,.72)}
.buy-in{--c:#ff4fd8;--cg:rgba(255,79,216,.35);position:relative;width:100%;max-width:460px;margin:0 8px 8px;padding:16px 16px 14px;border-radius:22px;border:1.5px solid var(--c);
  background:linear-gradient(180deg,#1c1535,#0d0a1c);box-shadow:0 0 26px var(--cg);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.buy-in img{width:132px;height:132px}
.buy-kind{font:400 11px var(--f-arc);letter-spacing:.24em;color:var(--c)}
.buy-in h3{margin:0;font:500 24px var(--f-disp);color:#fff}
.buy-in p{margin:0;font-size:13px;line-height:1.6;color:#c4bde0;max-width:34em}
.buy-in .note{font-size:12px;color:#8f88b0}
.buy-btns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;width:100%;margin-top:8px}
.nbtn{padding:13px 10px;border-radius:14px;font:800 15px var(--f-body);cursor:pointer;border:1.5px solid #4a4268;background:transparent;color:#c4bde0}
.nbtn.gold{border:0;background:linear-gradient(180deg,#fff0a6,#ffc21f);color:#2a1800;box-shadow:0 4px 0 #a86f00,0 0 16px rgba(255,216,74,.45);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.nbtn.gold:disabled{background:#262040;color:#7d769c;box-shadow:0 4px 0 #120f24;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.bulbs::after,.socket.pop,.wallet.spend,.buy-in,.toast{animation:none}}
.sheet{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:8px;z-index:6;max-width:460px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{border:1.5px solid var(--line);border-radius:18px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 30px rgba(0,0,0,.7)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h3{margin:0;font-size:15px;color:var(--ink)}
.x{font:700 12px var(--f-body);color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
.info{margin:0;font-size:13px;line-height:1.6;color:var(--dim)} .info b{color:var(--ink)}
</style>
</head>
<body>

<div id="app">
  <canvas id="cv" aria-label="くぎだまディフェンスの台"></canvas>
  <header class="hud">
    <div class="money" id="money" role="img" aria-label="お金 0"><i class="coin"></i><b id="balls">0</b></div>
    <div class="hud-r">
      <div class="wave" id="wave">WAVE 1/10</div>
      <button class="snd" id="mute" aria-pressed="true" aria-label="音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="currentColor" stroke="none" d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z"/><g class="sw"><path d="M14.5 9a4 4 0 0 1 0 6"/><path d="M17 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="sx"><path d="M15 9.5l5 5M20 9.5l-5 5"/></g></svg></button>
    </div>
  </header>
  <div class="bottom">
    <div class="handle" id="handle" tabindex="0" role="slider" aria-label="ハンドル。回して玉を打つ強さを変える" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <div class="dial" id="dial" aria-hidden="true"><div class="ring" id="ring"></div><div class="dial-knob" id="dialKnob"></div><span class="dial-lbl l">弱</span><span class="dial-lbl r">強</span></div>
    </div>
  </div>

  <div class="overlay" id="title">
    <div class="panel">
      <h1 class="logo"><span class="a">くぎだま</span><span class="b">ディフェンス</span></h1>
      <button class="btn primary" id="startBtn">スタート</button>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="panel">
      <h2 id="resTitle"></h2>
      <ul class="lines" id="resLines"></ul>
      <div class="btnrow">
        <button class="btn primary" id="resBtn"></button>
        <button class="btn" id="resBtn2" hidden></button>
      </div>
    </div>
  </div>

  <div class="hub" id="hub" hidden>
    <header class="hub-top">
      <div class="sign"><b id="hubTitle">台えらび</b></div>
      <div class="wallet" id="wallet" role="img" aria-label="お金"><i class="coin"></i><b id="hubCoins">0</b></div>
    </header>
    <div class="bulbs" aria-hidden="true"></div>
    <main class="hub-body" id="hubBody"></main>
    <nav class="tabs" id="tabs" role="tablist" aria-label="ロビー">
      <button data-tab="board" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V10a7 7 0 0 1 14 0v11z"/><circle cx="9.5" cy="11" r="1" fill="currentColor"/><circle cx="14.5" cy="11" r="1" fill="currentColor"/><circle cx="12" cy="15" r="1" fill="currentColor"/></svg>台</button>
      <button data-tab="ball" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7.5"/><path d="M8.8 9.6a3.6 3.6 0 0 1 3.4-2.3" stroke-linecap="round"/></svg>玉</button>
      <button data-tab="tower" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="11" cy="14" r="6"/><rect x="8" y="11" width="6" height="6" rx="1.5"/><path d="M14 13l6.5-6.5" stroke-width="2.6" stroke-linecap="round"/></svg>タワー</button>
      <button data-tab="gimmick" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/><circle cx="12" cy="3" r=".9" fill="currentColor"/><circle cx="21" cy="12" r=".9" fill="currentColor"/></svg>ギミック</button>
      <button data-tab="set" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="4" cy="12" r="2.4"/><circle cx="9.3" cy="12" r="2.4"/><circle cx="14.7" cy="12" r="2.4"/><circle cx="20" cy="12" r="2.4"/><path d="M2 16.5h20" stroke-linecap="round"/></svg>セット</button>
    </nav>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="buysheet" id="buy" hidden>
      <div class="buy-back" id="buyBack"></div>
      <div class="buy-in" id="buyIn" role="dialog" aria-modal="true" aria-labelledby="buyName">
        <img id="buyIco" alt="">
        <div class="buy-kind" id="buyKind"></div>
        <h3 id="buyName"></h3>
        <p id="buyDesc"></p>
        <p class="note" id="buyNote"></p>
        <div class="buy-btns"><button class="nbtn" id="buyNo">やめる</button><button class="nbtn gold" id="buyYes"></button></div>
      </div>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-in">
      <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="x" id="sheetClose">とじる</button></div>
      <div class="items" id="sheetBody"></div>
    </div>
  </div>
</div>

<script>
(()=>{
const W=360,H=600;
const $=id=>document.getElementById(id);
const cv=$('cv');
let ctx=cv.getContext('2d');                  // お店のアイコンを描くときだけ、一時的に別のキャンバスにかえる
const staticCv=document.createElement('canvas');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PINK='#ff4fd8',CYAN='#3ef2ff',GOLD='#ffd84a',INK='#f3eeff';
const MOON='#f3e6b5',FIRE='#d8f26a',BERRY='#ff8f7e';
const RAINBOW=['#ff4f6d','#ffa94f','#ffe94f','#5fff8a','#4fd8ff','#c26bff'];
const COIN='<i class="coin"></i>';           // お金のマーク（持ち玉はお金として見せる）
const NUMF='"M PLUS Rounded 1c",sans-serif';
const DISPF='"Kiwi Maru","M PLUS Rounded 1c",serif';
const BODYF='"M PLUS Rounded 1c",sans-serif';
const rad=d=>d*Math.PI/180;

/* 台の形：上が半円の外レール。玉は左下の発射口から左の通り道を上がり、上のレールを右へ回って台に落ちる（本物の台と同じ） */
const CX=180, CY=180, RO=166, RI=151, RB=158.5;
const XI=CX-RI, XB=CX-RB, WALL_R=CX+RO;      // 内レール 29・玉の通り道 21.5・右の外レール 346
const LAUNCH_Y=576, STRAIGHT=LAUNCH_Y-CY, RAIL_BOTTOM=592;
const EXIT0=rad(34);                          // 内レールの終わり（戻り玉防止の弁）
const FIRE_GAP=1.2;                           // 1分に50発（タワーと一緒に戦うため、本物の台の半分）
// 玉は打ち上げた勢いが重力で少しずつ落ち、外レールにそって回り、速さが足りなくなった所で自然にレールからはなれる。
// 強さ→はなれる角度（右が0・上が90°）の表。50%で台のまん中（x188）に落ちるように逆算してある
const AIM=[145.7,145.7,145.1,144.2,143,141.2,139,136.1,132.7,128.3,122.9];
const exitAngle=s=>{const v=Math.max(0,Math.min(1,s))*10,i=Math.min(9,Math.floor(v));return rad(AIM[i]+(AIM[i+1]-AIM[i])*(v-i))};
const launchE=(s,g)=>g*(3*RB*Math.sin(exitAngle(s))+2*STRAIGHT); // 打ち出しの速さの2乗（その角度でちょうどはなれる勢い）
const aimX=s=>158+142*Math.pow(Math.max(0,Math.min(1,s)),2.2);    // その強さで玉が落ちるあたり（上の▼）

// 玉：タワーに当たるとバフをつける（デッキビルド）。属性弾はタワーにも敵にも属性をつける
const BALLS={
  normal:{name:'ノーマル玉',color:'#dfe6ec',e:.5,g:.16,r:5,dmg:1,price:0,desc:'タワーに当てると経験値がたまる'},
  fire:{name:'火炎弾',color:'#ff7a3d',el:'fire',e:.5,g:.16,r:5,dmg:1,price:200,desc:'「火」をつける。燃えた敵は少しずつダメージ'},
  ice:{name:'氷結弾',color:'#8fe3ff',el:'ice',e:.5,g:.16,r:5,dmg:1,price:200,desc:'「氷」をつける。こおった敵はおそくなる'},
  bolt:{name:'雷弾',color:'#ffe14f',el:'bolt',e:.5,g:.16,r:5,dmg:1,price:200,desc:'「雷」をつける。近くの敵にもとびうつる'},
  poison:{name:'毒弾',color:'#c08bff',el:'poison',e:.5,g:.16,r:5,dmg:1,price:200,desc:'「毒」をつける。重なって長くつづく'},
  lead:{name:'鉛玉',color:'#8e98a6',e:.28,g:.2,r:6.5,dmg:3,price:200,buff:'pow',desc:'重くて跳ねない。敵に3ダメージ。タワーの攻撃力アップ'},
  heal:{name:'回復弾',color:'#7dffb0',e:.5,g:.16,r:5,dmg:1,price:150,heal:4,desc:'ヘソに入るとライフが4回復。ほかはノーマル玉と同じ'},
  bb:{name:'BB弾',color:'#f4f1e8',e:.88,g:.12,r:4,dmg:.5,price:200,buff:'rapid',desc:'軽くてよく跳ねる。タワーの連射アップ'},
  // 森の台が開くと お店にならぶ（board＝その台の番号）
  water:{name:'水弾',color:'#4fb8ff',el:'water',e:.5,g:.16,r:5,dmg:1,price:200,board:1,desc:'「水」をつける。ぬれた敵は少し押しもどされる'},
  vine:{name:'つる弾',color:'#6fe36a',el:'vine',e:.5,g:.16,r:5,dmg:1,price:200,board:1,desc:'「つる」をつける。からまった敵は少し止まる'},
};
// 属性。タワーの上で2つの属性が出会うと「わざ」になる
const ELEM={
  fire:{name:'火',color:'#ff7a3d'},
  ice:{name:'氷',color:'#8fe3ff'},
  bolt:{name:'雷',color:'#ffe14f'},
  poison:{name:'毒',color:'#c08bff'},
  water:{name:'水',color:'#4fb8ff'},
  vine:{name:'つる',color:'#6fe36a'},
};
const EL_ORDER=['fire','ice','bolt','poison','water','vine'];
const comboKey=(a,b)=>EL_ORDER.indexOf(a)<EL_ORDER.indexOf(b)?a+'+'+b:b+'+'+a;
// 同じ属性が重なると「とくしゅ効果」（属性タワーなら、その属性弾が1つ当たるだけで出る）
const SPECIAL={
  fire:{name:'ばくはつ',color:'#ff9a3d',desc:'弾が当たると爆発して、まわりの敵にもダメージとやけど'},
  ice:{name:'氷の霧',color:'#d8f6ff',desc:'弾が当たった所に霧が残って、中の敵はとてもおそくなる'},
  bolt:{name:'いなずま',color:'#fff27a',desc:'4体にとびうつって、少しのあいだ止める'},
  poison:{name:'毒の沼',color:'#b77bff',desc:'弾が当たった所に毒の沼が残って、中の敵にどく'},
  water:{name:'大波',color:'#7fd0ff',desc:'弾が当たると大波。まわりの敵をまとめて押しもどして、ぬらす'},
  vine:{name:'いばら',color:'#8fe36a',desc:'弾が当たった所にいばらが残って、中の敵はとてもおそく・少しダメージ'},
};
// ちがう属性が出会うと「わざ」
const COMBO={
  'fire+ice':{name:'スチーム',color:'#eaf6ff',desc:'弾が当たると、まわりの敵もやけど＋おそくなる'},
  'fire+bolt':{name:'プラズマ',color:'#ffb347',desc:'3体にとびうつって、とびうつった敵も燃える'},
  'fire+poison':{name:'どくの炎',color:'#ff6fae',desc:'やけどとどくを、2倍の強さでつける'},
  'ice+bolt':{name:'かみなり氷',color:'#a8fbff',desc:'3体にとびうつって、少しのあいだ止める'},
  'ice+poison':{name:'こおり毒',color:'#a99bff',desc:'とてもおそくして、どくもつける'},
  'bolt+poison':{name:'しびれ毒',color:'#dcff5f',desc:'どくがとびうつって広がる'},
  // 森の水・つる
  'fire+water':{name:'ねっとう',color:'#ff9f8a',desc:'熱いお湯。やけど2倍と、ぬれる。少しダメージも'},
  'ice+water':{name:'カチコチ',color:'#bfeaff',desc:'こおりづけにして、しばらく止める'},
  'bolt+water':{name:'かんでん',color:'#9ff0ff',desc:'5体にとびうつる。ぬれた敵は少し止まる'},
  'poison+water':{name:'どくの雨',color:'#a98bff',desc:'まわりの敵にどくの雨。どく＋ぬれる'},
  'fire+vine':{name:'もえうつり',color:'#ffb54f',desc:'つるに火がついて、まわりの敵にも燃えうつる'},
  'ice+vine':{name:'しもばしら',color:'#c8f7d8',desc:'長くからめて、そのあともおそくする'},
  'bolt+vine':{name:'でんきづる',color:'#d8ff6a',desc:'4体にとびうつって、とびうつった敵もからめる'},
  'poison+vine':{name:'どくいばら',color:'#9be07a',desc:'どく2倍と、小さないばら'},
  'water+vine':{name:'すくすく',color:'#7ef0b0',desc:'つるがのびて、まわりの敵もからめとる'},
};
const LIFE_MAX=10;                            // ライフ（上のバー）
const BUFF_T=10;                              // 玉でついた属性・とくしゅ効果・わざ・攻撃UP・連射UP がつづく秒数
const TOWERS={
  basic:{name:'ふつうタワー',color:'#a6e38c',range:78,rate:.9,dmg:1.7,cost:30,desc:'近くの敵を自動で撃つ'},
  fire:{name:'ほのおタワー',color:'#ff8a4a',range:74,rate:.95,dmg:2.9,cost:45,el:'fire',unlock:400,desc:'弾でやけど。火炎弾が当たると「ばくはつ」'},

const glowCache=new Map();
function glowSprite(color){
  let s=glowCache.get(color); if(s) return s;

}

function arcRow(r,a0,a1,step){const o=[];for(let a=a0;a<=a1+.01;a+=step)o.push([CX+r*Math.cos(rad(a)),CY-r*Math.sin(rad(a))]);return o}
function line(x1,y1,x2,y2,n){const o=[];for(let i=0;i<n;i++){const t=i/(n-1);o.push([x1+(x2-x1)*t,y1+(y2-y1)*t])}return o}

function roll(P,walls,x1,y1,x2,y2,n){
  P.push(...line(x1,y1,x2,y2,n));
  const L=Math.hypot(x2-x1,y2-y1), nx=-(y2-y1)/L*2.5, ny=(x2-x1)/L*2.5;
  walls.push([x1+nx,y1+ny,x2+nx,y2+ny,1],[x1-nx,y1-ny,x2-nx,y2-ny,1]);
}

    walls:L.walls.map(([x1,y1,x2,y2,r])=>[fx(x1),y1,fx(x2),y2,r]),
    frame:L.frame&&L.frame.map(([x,y])=>[fx(x),y]),
    lcd:L.lcd&&{...L.lcd,x:360-L.lcd.x-L.lcd.w},
    mills:L.mills.map(m=>({...m,x:fx(m.x),dir:-m.dir})),
    pockets:L.pockets.map(q=>({...q,x:fx(q.x)})),

function buildNeon(c){

      c.beginPath(); c.arc(mx,my-ms*.8,ms,Math.PI,0); c.closePath(); c.stroke();
    }
  }

  c.strokeStyle=hexA(CYAN,.55); c.lineWidth=1.6;
  c.beginPath(); c.moveTo(XI,RAIL_BOTTOM); c.lineTo(XI,CY); c.arc(CX,CY,RI,Math.PI,Math.PI+EXIT0,false); c.stroke();
  // 戻り玉防止の弁
  c.shadowColor=GOLD; c.strokeStyle=GOLD; c.lineWidth=2;
  c.beginPath(); c.moveTo(CX-RI*Math.cos(EXIT0),CY-RI*Math.sin(EXIT0)); c.lineTo(CX-RO*Math.cos(EXIT0),CY-RO*Math.sin(EXIT0)); c.stroke();
  // 発射口

  // 枠

    c.shadowBlur=0; rrPath(c,L.x,L.y,L.w,L.h,8); c.fillStyle=lg; c.fill();
    c.shadowColor=S.accent; c.shadowBlur=8; c.strokeStyle=hexA(S.accent,.9); c.lineWidth=2;
    c.beginPath(); c.moveTo(120,314); c.lineTo(122,322); c.lineTo(172,334); c.stroke();

    c.shadowColor=color; c.shadowBlur=10; c.strokeStyle=color; c.lineWidth=2;
    c.beginPath(); c.moveTo(x-w/2,y); c.lineTo(x-w/2+2,y+12); c.lineTo(x+w/2-2,y+12); c.lineTo(x+w/2,y); c.stroke();

    }

    }
    if(q.k==='warp'){
      c.shadowColor=CYAN; c.shadowBlur=8; c.strokeStyle=CYAN; c.lineWidth=1.6;
      c.beginPath(); c.moveTo(q.x+6,q.y); c.lineTo(q.x+6,q.y+10); c.lineTo(q.x-6,q.y+10); c.stroke();
      c.shadowBlur=0; c.fillStyle=CYAN; c.font=`700 8px ${BODYF}`; c.textAlign='center'; c.fillText('ワープ',q.x-2,q.y+20);
    }
  }

  c.shadowBlur=0; c.fillStyle=hexA(CYAN,.7); c.font=`700 7px ${NUMF}`; c.textAlign='center'; c.fillText('OUT',180,564.5);
  // 釘

    if(p.tower) continue;
    const col=p.fixed?GOLD:S.peg;

    c.beginPath(); c.arc(p.x,p.y,p.fixed?3:3.3,0,Math.PI*2); c.fill();
  }
  c.shadowBlur=0;
}

// 台を画面いっぱいに。縦長の画面では横ぴったりにして、下にハンドルの場所（84px）を残す
function resize(){
  const r=$('app').getBoundingClientRect();
  if(r.width<10||r.height<10) return;
  VW=r.width; VH=r.height;
  const res=VH>VW*1.2?64:0;
  scale=Math.min(VW/W,(VH-res)/H); dpr=Math.min(window.devicePixelRatio||1,2);
  const extra=VH-H*scale;
  ox=(VW-W*scale)/2; oy=Math.max(0,Math.min(extra-84,extra*.3));
  cv.style.width=VW+'px'; cv.style.height=VH+'px';
  cv.width=Math.round(VW*dpr); cv.height=Math.round(VH*dpr);
  buildStatic();
}
// 画面の中で見えている広さ（台の座標で）

/* ---------- ウェーブ ---------- */
function waveList(stage,w){
  const F=STAGES[stage].foes;   // ふつう・はやい・かたい・中ボス・ボス
  const boss=w===MID_WAVE?F[3]:w===WAVES?F[4]:null;
  const n=Math.round((WAVE_N[0]+w*WAVE_N[1]+stage*3)*(boss?.6:1)), list=boss?[boss]:[];
  for(let i=0;i<n;i++){
    const r=Math.random();
    list.push(w>=3&&r<.2?F[2]:w>=2&&r<.45?F[1]:F[0]);
  }
  return list;
}
function startWave(w){
  const q=waveList(G.stage,w); G.wave=w; G.spawnQ=G.spawnQ.concat(q); G.spawnGap=Math.max(.5,SPAWN_T/q.length); G.spawnT=2; G.waveDone=false; G.waveT=WAVE_T;
  banner('WAVE '+w,MOON,1.6,260); sfx.wave(); if(w>1) cheerRun(MOON);
}
// 敵が台の外（レールの上）にはみ出さないように、横の位置をおさえる
function inArch(x,y,r){
  x=Math.max(XI+r+4,Math.min(WALL_R-r-4,x));
  if(y<CY){const R=RI-r-4,d=CY-y,m=d<R?Math.sqrt(R*R-d*d):0;x=Math.max(CX-m,Math.min(CX+m,x))}
  return x;
}
// 敵は台の中（内レールの内がわ）の上の方に出る。ボスはHPバーが台の上に出る高さから。
// まず その色の光の出口がうずを巻いてひらき、少しして中から ぽんと飛び出す（14回目）
function spawn(t,at){
  const E=ENEMIES[t];
  const r=E.r*G.bscale, R=RI-r-4;
  let x,y;
  if(at){x=at.x+(Math.random()-.5)*at.r*2.2;y=at.y+at.r*.4}
  else{x=E.boss?188+(Math.random()-.5)*36:CX+(Math.random()*2-1)*R*.84;y=CY-Math.sqrt(R*R-(x-CX)**2);if(E.boss)y=Math.max(y,20+r*1.62)}
  x=inArch(x,y,r);
  const d=at?.3:E.boss?.75:.45;
  G.pend.push({t,x,y,d});
  G.portals.push({x,y,r,c:E.color,age:0,open:d,dur:d+.5,boss:!!E.boss});
  if(E.boss){
    G.shake=.3; sfx.hurt();
    banner(E.boss===2?'ボス出現！':'中ボス出現！',E.color,2,230);
    G.alarm=2.6; G.alarmC=E.color;            // 台のまわりが警告の色で点滅
  }else if(!at) sfx.gate();
}
// 敵をその場に出す（o で中身を上書き）

// ドロン：白いけむりと葉っぱ

// たぬき（中ボス）：葉っぱで化けて、にせもの2つ。3つの場所を入れかえるので、どれが本物かわからなくなる（にせものは頭に葉っぱ）
function doDorn(e){
  for(const o of G.en) if(o.fake&&o.real===e&&!o.dead){o.dead=true;dornFx(o.x,o.y,o.r)}
  const d=e.r*2.3, spots=[[e.x,e.y],[e.x-d,e.y+6],[e.x+d,e.y+6]];
  for(let i=spots.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[spots[i],spots[j]]=[spots[j],spots[i]]}
  e.x=inArch(spots[0][0],spots[0][1],e.r); e.y=spots[0][1]; e.leaf=false; e.flash=0;
  e.laughT=1.2;

function throwHat(e){
  let best=null,bd=HAT_R*HAT_R;
  for(const p of G.pegs){const T=p.tower;if(!T||T.hat>0||G.hats.some(h=>h.p===p))continue;const d=(p.x-e.x)**2+(p.y-e.y)**2;if(d<bd){bd=d;best=p}}
  if(!best) return;
  e.hatGone=true; G.hats.push({x0:e.x,y0:e.y-e.r*.95,p:best,t:0,dur:.75,s:e.r/14,from:e}); sfx.toss();
}

function dropNut(){
  let x; do{x=60+Math.random()*240}while(Math.abs(x-XB)<40);
  const r=NUT.r*G.bscale, y=CY-Math.sqrt(RI*RI-(x-CX)**2)+r+6, cs=Object.values(NEON);

function stepNuts(f,dt){
  for(const n of G.nuts){
    n.age+=dt;
    if(n.warn>0){n.warn-=dt;continue}
    const steps=Math.max(2,Math.ceil(f*3)), h=f/steps;
    for(let s=0;s<steps&&!n.gone;s++){
      n.vy+=NUT.g*h; n.x+=n.vx*h; n.y+=n.vy*h;
      for(const w of G.walls) segHit(n,w,.3);
      bound(n);
      for(const p of G.pegs) dotHit(n,p.x,p.y,p.tower&&p.tower.gm==='bumper'?p.r+BUMP_R:p.r,NUT.e);
      for(const e of G.en){
        if(e.dead||n.hit[e.id]) continue;
        const dx=n.x-e.x, dy=n.y-e.y, rr=n.r+e.r; if(dx*dx+dy*dy>=rr*rr) continue;
        n.hit[e.id]=1; dotHit(n,e.x,e.y,e.r,.5);
        burst(n.x,n.y,n.c,10); G.rings.push({x:n.x,y:n.y,R:n.r*3,c:n.c,t:.35}); sfx.splat();
        if(e.fake){vanishFake(e);continue}
        if(e.ghost>0){e.ghost=0;e.stun=Math.max(e.stun||0,.9);e.oops=.8;sfx.oops()}
        hurtEnemy(e,NUT.dmg*(1+HP_GROW*(G.wave-1)));
      }
      if(n.y>H+10) n.gone=true;
    }
    if(n.age>15) n.gone=true;

  G.nuts=G.nuts.filter(n=>!n.gone);
}

function mushPuff(m){

    .filter(o=>o.d<ROOT.R*ROOT.R).sort((a,b)=>a.d-b.d).slice(0,ROOT.n);

// サウンドタワー：弾を撃たずに、とどく広さの敵みんなに音の波。玉でついた属性は波の中の敵みんなに、とくしゅ効果・わざは受け皿に近い SOUND_FX 体に
function soundTower(p,T,D){
  const R=D.range*(1+.08*(T.lv-1))*G.rscale, hit=[];
  for(const e of G.en){if(e.dead||e.ghost>0)continue;const dx=e.x-p.x,dy=e.y-p.y;if(dx*dx+dy*dy<=(R+e.r*.5)**2)hit.push(e)}
  if(!hit.length){T.cd=.12;return}
  const dmg=D.dmg*(1+.4*(T.lv-1))*(T.pow>0?1.7:1)*(G.fever>0?2:1), el=curEl(T);
  hit.sort((a,b)=>b.y-a.y);

    else if(T.spT>0){if(i<SOUND_FX)applySpecial(e,T.sp,dmg)}
    else if(el) applyEl(e,el,1,dmg);
  });
  const c=T.comboT>0?COMBO[T.combo].color:T.spT>0?SPECIAL[T.sp].color:el?ELEM[el].color:D.color;
  G.sw.push({x:p.x,y:p.y,r0:p.r,R,t:0,max:.55,c});
  T.cd=D.rate*Math.pow(.85,T.lv-1)*(T.rapid>0?.5:1)*(G.fever>0?.5:1); T.shot=.12; sfx.boom();
}

const comboEls=k=>k.split('+');
// わざごとの色（どくの炎はピンクの炎など）。なければ属性の色
const COMBO_TINT={'fire+water':{water:'#ffd2c4'},'bolt+water':{bolt:'#9ff0ff'},'poison+water':{water:'#b9a6ff'},'fire+vine':{vine:'#ffcf6a'},'ice+vine':{vine:'#c8f7d8'},'bolt+vine':{bolt:'#d8ff6a'},'water+vine':{water:'#8ff0d0'},'fire+poison':{fire:'#ff6fae'},'bolt+poison':{bolt:'#dcff5f',poison:'#b6e05a'},'fire+bolt':{bolt:'#ffb347'},'ice+bolt':{bolt:'#a8fbff'},'ice+poison':{ice:'#c9b8ff'}};
// 毎コマ：玉・タワー・弾・敵・ゾーンから属性の粒を出す
function emitFx(dt){
  for(const b of G.bs){
    const el=BALLS[b.t].el; if(!el) continue;
    for(let i=fxN(el==='fire'?42:28,dt);i--;) fxEl(el,b.x,b.y,b.r*(el==='bolt'?1.5:.7),false);
    if(el==='ice'&&Math.random()<dt*3) fxMist(b.x,b.y,b.r*2.4,'#cfefff',false);
  }
  for(const p of G.pegs){
    const T=p.tower; if(!T) continue; const R=p.r;
    if(T.comboT>0){
      const k=T.combo, [a,b]=comboEls(k), tint=COMBO_TINT[k]||{};
      for(const el of [a,b]) for(let i=fxN(17,dt);i--;) fxEl(el,p.x,p.y,R*1.3,true,tint[el]);
      if(k==='fire+ice'&&Math.random()<dt*6) fxMist(p.x,p.y-4,R*1.5,'#f4f9ff',true);      // スチーム：白い湯気
      if((a==='bolt'||b==='bolt')&&Math.random()<dt*5) fxArc(p.x,p.y,R,R+20,tint.bolt);
    }else if(T.spT>0){
      const el=T.sp;
      for(let i=fxN(el==='bolt'?26:30,dt);i--;) fxEl(el,p.x,p.y,el==='poison'?R*1.7:R*1.25,true);
      if(el==='ice'&&Math.random()<dt*6) fxMist(p.x,p.y,R*1.8,'#dff4ff',false);           // 氷の霧
      if(el==='bolt'&&Math.random()<dt*7) fxArc(p.x,p.y,R,R+24);                          // いなずま
    }else{
      const el=curEl(T); if(!el) continue;
      for(let i=fxN(T.elT>0?16:6,dt);i--;) fxEl(el,p.x,p.y,R*(T.elT>0?1.1:.9),false);    // 玉でついた属性は多め、タワーそのものの属性は少し
      if(el==='bolt'&&T.elT>0&&Math.random()<dt*2) fxArc(p.x,p.y,R,R+14);
    }
  }
  for(const u of G.bl){
    if(!u.fx) continue;
    const el=u.fx.el||u.fx.sp||comboEls(u.fx.combo)[Math.random()<.5?0:1];
    for(let i=fxN(30,dt);i--;) fxEl(el,u.x,u.y,2,false,u.fx.combo&&(COMBO_TINT[u.fx.combo]||{})[el]);
  }
  for(const e of G.en){
    if(e.dead) continue;
    if(ENEMIES[e.t].gh) for(let i=fxN(e.ghost>0?8:2.2,dt);i--;) {const a=Math.PI+Math.random()*Math.PI;fxAdd({k:'wisp',x:e.x+Math.cos(a)*e.r*.95,y:e.y-e.r*.1+Math.sin(a)*e.r*.95,vx:Math.cos(a)*.15,vy:-(.1+Math.random()*.18),max:.8+Math.random()*.5,s:e.r*(.1+Math.random()*.1),ph:Math.random()*6.28,c:ENEMIES[e.t].color})}
    if(e.burn>0) for(let i=fxN(12,dt);i--;) fxEl('fire',e.x,e.y-e.r*.35,e.r*.75,false);
    if(e.slow>0) for(let i=fxN(5,dt);i--;) fxEl('ice',e.x,e.y,e.r*1.05,false);
    if(e.psnT>0) for(let i=fxN(7,dt);i--;) fxEl('poison',e.x,e.y-e.r*.2,e.r*.8,false);
    if(e.stun>0||e.shock>0){for(let i=fxN(14,dt);i--;) fxEl('bolt',e.x,e.y,e.r*1.2,false);if(Math.random()<dt*4)fxArc(e.x,e.y,e.r,e.r+10)}
    if(e.wet>0) for(let i=fxN(5,dt);i--;) fxAdd({k:'drop',x:e.x+(Math.random()-.5)*e.r*1.4,y:e.y+e.r*.3,vx:0,vy:.6,max:.4,s:1.6+Math.random()*.8});   // ぬれた敵からしずく
    if(e.vineT>0) for(let i=fxN(2.5,dt);i--;) fxEl('vine',e.x,e.y+e.r*.2,e.r*.9,false);
    if(e.sleep>0&&Math.random()<dt*2) fxAdd({k:'wisp',x:e.x+(Math.random()-.5)*e.r,y:e.y-e.r*.6,vx:0,vy:-.25,max:.9,s:1.4,ph:Math.random()*6.28,c:'#d6a8ff'});
  }
  for(const z of G.zones){
    if(z.k==='ice'){if(Math.random()<dt*5)fxMist(z.x,z.y,z.R*1.2,'#e3f6ff',false);for(let i=fxN(4,dt);i--;)fxEl('ice',z.x,z.y,z.R*.9,false)}
    if(z.k==='thorn') for(let i=fxN(3,dt);i--;)fxEl('vine',z.x,z.y,z.R*.8,false);
  }
}
function updateFxParts(dt){
  const f=dt*60;

    q.t+=dt;
    if(q.k==='flame'){q.x+=q.vx*f;q.y+=q.vy*f;q.vx*=.94;q.vy=q.vy*.96-.02*f}
    else if(q.k==='frost'){q.x+=q.vx*f;q.y+=q.vy*f;q.vx*=.95;q.vy=q.vy*.95+.006*f;q.rot+=q.vr*dt}
    else if(q.k==='bubble'){q.x+=q.vx*f+Math.sin(G.time*7+q.ph)*.15*f;q.y+=q.vy*f;q.vx*=.92;q.vy=q.vy*.97-.004*f}
    else if(q.k==='mist'){q.x+=q.vx*f;q.y+=q.vy*f}
    else if(q.k==='wisp'){q.x+=q.vx*f+Math.sin(G.time*3+q.ph)*.12*f;q.y+=q.vy*f}
    else if(q.k==='drop'){q.x+=q.vx*f;q.y+=q.vy*f;q.vx*=.96;q.vy+=.05*f}
    else if(q.k==='leaf'){q.x+=q.vx*f+Math.sin(G.time*4+q.rot)*.18*f;q.y+=q.vy*f;q.vx*=.95;q.vy=q.vy*.95+.012*f;q.rot+=q.vr*dt}
  }
  G.fx=G.fx.filter(q=>q.t<q.max);
}

      ctx.moveTo(q.x-(c-d)*.45,q.y-(d+c)*.45); ctx.lineTo(q.x+(c-d)*.45,q.y+(d+c)*.45); ctx.stroke();
    }else if(q.k==='spark'){

      ctx.globalAlpha=Math.min(1,a*1.6); ctx.strokeStyle=q.c?mixW(q.c,.35):'#fff6a8'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(mx,my); ctx.lineTo(x2,y2); ctx.stroke();

  if(b.y>=CY-2&&b.x<XI+1.5+r){b.x=XI+1.5+r;if(b.vx<0)b.vx=-b.vx*.5}
}

function stepBalls(f){
  const ivy=G.pegs.filter(p=>p.tower&&p.tower.gm==='ivy');
  for(const b of G.bs){
    const B=BALLS[b.t];
    if(b.rail){
      // 左の通り道を上がって、外レールにそって右へ回る。重力で少しずつおそくなり、
      // 遠心力より重力が勝った所（v² < g・R・sinθ）で、その速さのままレールからはなれる
      const g=B.g, n=3, h=f/n, hgt=th=>STRAIGHT+RB*Math.sin(th);
      for(let k=0;k<n&&b.rail;k++){
        const th0=Math.PI-Math.max(0,b.s-STRAIGHT)/RB;
        b.s+=Math.sqrt(Math.max(.04,b.e0-2*g*(b.s<=STRAIGHT?b.s:hgt(th0))))*h;
        if(b.s<=STRAIGHT){b.x=XB;b.y=LAUNCH_Y-b.s;continue}
        const th=Math.PI-(b.s-STRAIGHT)/RB, v2=Math.max(.04,b.e0-2*g*hgt(th));
        b.x=CX+RB*Math.cos(th); b.y=CY-RB*Math.sin(th);
        if(th<Math.PI-EXIT0-.01&&(v2<g*RB*Math.sin(th)||th<rad(24))){
          const v=Math.sqrt(v2);
          b.x=CX+(RB-1.5)*Math.cos(th); b.y=CY-(RB-1.5)*Math.sin(th);
          b.vx=Math.sin(th)*v; b.vy=Math.cos(th)*v; b.rail=false;
        }
      }
      continue;
    }
    const steps=Math.max(2,Math.ceil(f*3)), h=f/steps;
    for(let s=0;s<steps&&!b.gone;s++){
      b.vy+=B.g*h;
      if(B.maxVy&&b.vy>B.maxVy) b.vy=B.maxVy;
      // 引きよせツタ：近くを通る玉を杭の方へ引きよせる（1つの玉は IVY_T 秒まで）
      for(const p of ivy){
        const dx=p.x-b.x, dy=p.y-b.y, d2=dx*dx+dy*dy, R=p.r+IVY_R; if(d2>R*R) continue;
        const used=b.ivy?b.ivy[p.id]||0:0, d=Math.sqrt(d2)||1; if(used>=IVY_T||d<p.r+b.r+.5) continue;
        const k=IVY_K*h; b.vx+=dx/d*k; b.vy+=dy/d*k;
        (b.ivy||(b.ivy={}))[p.id]=used+h/60; p.tower.pull=.15; p.tower.pullB=b;
      }
      const sp=Math.hypot(b.vx,b.vy); if(sp>9){b.vx*=9/sp;b.vy*=9/sp}
      b.x+=b.vx*h; b.y+=b.vy*h;
      for(const w of G.walls) segHit(b,w,.3);
      for(const q of G.pockets){
        for(const [x,y] of posts(q)) dotHit(b,x,y,2.5,.4);
        if(q.k==='attacker'&&G.fever<=0) segHit(b,lid(q),.2);
      }
      bound(b);
      for(const p of G.pegs){
        const T=p.tower, gm=T&&T.gm;
        if(gm==='spinner'){spinHit(b,p,T);if(b.gone)break}
        const pr=gm==='bumper'?p.r+BUMP_R:p.r;
        const dy=b.y-p.y, lim=pr+b.r; if(dy>lim||dy<-lim) continue;
        const dx=b.x-p.x, rr=b.r+pr, d2=dx*dx+dy*dy; if(d2>=rr*rr) continue;
        const d=Math.sqrt(d2)||.01, nx=dx/d, ny=dy/d;
        b.x=p.x+nx*rr; b.y=p.y+ny*rr;
        const vn=b.vx*nx+b.vy*ny;
        if(vn<0){
          b.vx-=(1+B.e)*vn*nx;b.vy-=(1+B.e)*vn*ny;b.vx+=(Math.random()-.5)*.35;
          if(gm==='bumper'){b.vx+=nx*BUMP_K;b.vy+=ny*BUMP_K;T.bump=.25;sfx.bump()}   // バンパー：外へボヨンとはじく
          pegHit(p,b,-vn);
        }
      }
      // 森：まん中の切り株（よくはねる木）・ねむりきのこ（ぽよんとはねて、光っていれば胞子）
      for(const o of G.bigs){
        const dx=b.x-o.x, dy=b.y-o.y, rr=b.r+o.r; if(dx*dx+dy*dy>=rr*rr) continue;
        const v=Math.hypot(b.vx,b.vy); dotHit(b,o.x,o.y,o.r,.5); if(v>1.2) sfx.tick();
      }
      for(const m of G.mush){
        const dx=b.x-m.x, dy=b.y-m.y, rr=b.r+m.r; if(dx*dx+dy*dy>=rr*rr) continue;
        dotHit(b,m.x,m.y,m.r,MUSH.e); m.bop=.25;
        if(m.cd<=0) mushPuff(m);
      }
      for(const m of G.mills){
        // 風車：当たると羽根の回る向きに押し出す
        const dx=b.x-m.x, dy=b.y-m.y, rr=b.r+8.5, d2=dx*dx+dy*dy; if(d2>=rr*rr) continue;
        const d=Math.sqrt(d2)||.01, nx=dx/d, ny=dy/d;
        b.x=m.x+nx*rr; b.y=m.y+ny*rr;
        const vn=b.vx*nx+b.vy*ny; if(vn<0){b.vx-=1.3*vn*nx;b.vy-=1.3*vn*ny}
        b.vx+=-ny*m.dir*.55*h; b.vy+=nx*m.dir*.55*h;
        m.spin=Math.min(14,m.spin+.5);
      }
      for(const e of G.en){
        if(e.dead) continue;
        const dx=b.x-e.x, dy=b.y-e.y, rr=b.r+e.r, d2=dx*dx+dy*dy; if(d2>=rr*rr) continue;
        const d=Math.sqrt(d2)||.01, nx=dx/d, ny=dy/d;
        b.x=e.x+nx*rr; b.y=e.y+ny*rr;
        const vn=b.vx*nx+b.vy*ny; if(vn<0){b.vx-=1.6*vn*nx;b.vy-=1.6*vn*ny}
        const key='e'+e.id;
        if(G.time-(b.hit[key]??-9)>.3){
          b.hit[key]=G.time;
          if(e.fake){vanishFake(e);continue}                 // たぬきのにせものは玉1発で消える
          if(e.ghost>0){e.ghost=0;e.stun=Math.max(e.stun||0,.9);e.oops=.8;G.rings.push({x:e.x,y:e.y,R:e.r*1.6,c:'#ffffff',t:.35});sfx.oops()}   // すけすけの馬は、玉が当たるとびっくりして止まる
          const EE=ENEMIES[e.t];
          if(EE.curl&&e.curl>0){curlBounce(b,nx,ny,e);continue}   // まるまったはりねずみ：とげではね返されて効かない
          if(e.lick>0) knockPot(e);                                 // はちみつをなめているくま：ツボを落とす
          hurtEnemy(e,B.dmg*(G.fever>0?2:1));if(B.el)ballElOnEnemy(e,B.el,B.dmg);
          if(EE.curl&&!e.dead&&!(e.curlCD>0)){e.curl=CURL_T;e.curlHit=.15;G.rings.push({x:e.x,y:e.y,R:e.r*1.5,c:hexA(EE.color,.9),t:.3});sfx.kin()}   // 当たるとまるまる
        }
      }
      for(const q of G.pockets){
        const hw=pocketHW(q); if(hw<=0) continue;
        if(b.vy>0&&b.y>q.y&&b.y<q.y+10&&Math.abs(b.x-q.x)<hw){enterPocket(q,b);break}
      }
      if(!b.gone&&b.y>H+8){b.gone=true;G.stat.out=(G.stat.out||0)+1}
    }
    b.age+=f/60;
    if(b.vx*b.vx+b.vy*b.vy<.03){b.still+=f/60;if(b.still>.5){b.vx+=(Math.random()<.5?-1:1)*1.2;b.vy-=.6;b.still=0}}else b.still=0;
    if(b.age>30){b.gone=true;G.stat.timeout=(G.stat.timeout||0)+1}
  }
  G.bs=G.bs.filter(b=>!b.gone);
}

function update(dt){
  const f=dt*60;
  // 発射（ずっと出続ける）
  if(G.balls>0){G.fireT-=dt;if(G.fireT<=0) G.fireT=launch()?FIRE_GAP:.1}
  stepBalls(f);
  if(STAGES[G.stage].nuts){G.nutT-=dt;if(G.nutT<=0){G.nutT=NUT.every*(.7+Math.random()*.6);dropNut()}stepNuts(f,dt)}
  for(const m of G.mills){m.spin=Math.max(2.2,m.spin-dt*3);m.ang+=m.spin*m.dir*dt}
  G.launchFx=Math.max(0,G.launchFx-dt);
  // 敵が出る
  if(G.spawnQ.length){G.spawnT-=dt;if(G.spawnT<=0){spawn(G.spawnQ.shift());G.spawnT=G.spawnGap||1}}
  for(const p of G.pend){p.d-=dt;if(p.d<=0)popOut(p)}
  G.pend=G.pend.filter(p=>p.d>0);
  // 敵が進む
  for(const e of G.en){
    if(e.dead) continue;
    const E=ENEMIES[e.t], rd=E.boss?dt/(1-BOSS_RES):dt;   // 中ボス・ボスは状態異常が早くとける
    e.slow=Math.max(0,e.slow-rd); e.flash=Math.max(0,e.flash-dt); e.stun=Math.max(0,(e.stun||0)-rd); e.shock=Math.max(0,(e.shock||0)-rd);
    e.wet=Math.max(0,e.wet-rd); e.vineT=Math.max(0,e.vineT-rd); e.root=Math.max(0,e.root-rd); e.rootCD=Math.max(0,e.rootCD-dt); e.sleep=Math.max(0,e.sleep-rd); e.freeze=Math.max(0,e.freeze-rd); e.thorn=Math.max(0,e.thorn-dt);
    e.potGone=Math.max(0,e.potGone-dt); e.dodgeT=Math.max(0,(e.dodgeT||0)-dt); e.curlHit=Math.max(0,(e.curlHit||0)-dt);
    if(E.curl){if(e.curl>0){e.curl-=dt;if(e.curl<=0){e.curl=0;e.curlCD=CURL_CD}}else e.curlCD=Math.max(0,e.curlCD-dt)}
    if(e.thorn>0) hurtEnemy(e,.6*dt,true);
    if(e.burn>0){e.burn-=rd;hurtEnemy(e,e.burnD*dt,true)}
    if(e.psnT>0){e.psnT-=rd;hurtEnemy(e,e.psnD*dt,true)}
    if(e.dead) continue;
    const sf=e.slowF||.45, slowK=E.boss?1-(1-sf)*(1-BOSS_RES):sf;   // おそくなる強さも弱め
    let mv=1;
    if(E.hop){const q=(e.born*1.25+e.ph)%1;mv=q<.4?2.2:.2;e.hopY=q<.4?Math.sin(q/.4*Math.PI):0}   // うさぎ：ぴょんと進んで、ひと休み（ならすと同じ速さ）
    e.oops=Math.max(0,(e.oops||0)-dt); e.hurtT=Math.max(0,(e.hurtT||0)-dt); e.hpVis=Math.max(0,(e.hpVis||0)-dt); e.laughT=Math.max(0,(e.laughT||0)-dt);
    e.hpLag=Math.max(e.hp/e.max,(e.hpLag??1)-dt*.5*(e.hurtT>0?0:1));   // 減った所の白は、少し待ってからおいかける
    if(E.dash){   // 馬：ときどき すけすけになって猛ダッシュ（うしろに残像）
      if(e.ghost>0){e.ghost-=dt;mv*=DASH_K;e.trailT=(e.trailT||0)-dt;if(e.trailT<=0){e.trailT=.07;e.trail.push({x:e.x,y:e.y,a:.5})}}
      else if(e.stun<=0){e.dashT-=dt;if(e.dashT<=0){e.dashT=E.dash;e.ghost=DASH_D;sfx.dash();G.rings.push({x:e.x,y:e.y,R:e.r*1.8,c:hexA(E.color,.8),t:.4})}}
    }
    if(e.trail.length){for(const q of e.trail) q.a-=dt*1.6; e.trail=e.trail.filter(q=>q.a>0)}
    const held=e.stun>0||e.sleep>0, stop=held||e.root>0;      // ねむり・しびれ・からまり中は止まる（いたずらも、ねむり・しびれ中はお休み）
    // くま：ときどき はちみつをなめて回復（なめている間は止まる。ツボに玉が当たると落とす）
    if(E.honey&&!e.fake){
      if(e.lick>0){
        e.lick-=dt; mv=0; e.hp=Math.min(e.max,e.hp+e.max*HONEY.heal/HONEY.lick*dt);
        if(Math.random()<dt*8) G.parts.push({x:e.x+e.r*.2,y:e.y-e.r*.1,vx:(Math.random()-.5)*.5,vy:-.7,t:.5,c:'#ffd56a'});
        if(e.lick<=0){e.lick=0;e.honeyT=E.honey;e.laughT=1}
      }else if(!held&&!(e.potGone>0)){e.honeyT-=dt;if(e.honeyT<=0){e.lick=HONEY.lick;sfx.honey()}}
    }
    if(E.roots&&!held){e.rootT-=dt;if(e.rootT<=0){e.rootT=E.roots;rootTowers(e)}}   // 大木：根っこで砲台をしばる
    e.y+=e.sp*mv*(stop?0:(e.slow>0?slowK:1)*(e.thorn>0?.35:1))*f;
    if(e.push>0){const d=Math.min(e.push,PUSH_V*f);e.y=Math.max(40,e.y-d);e.push-=d}   // 水で押しもどされる
    if(e.vx){e.x+=e.vx*f;e.vx*=Math.pow(.93,f);if(Math.abs(e.vx)<.02)e.vx=0}
    const wob=E.zig?(Math.sin(e.born*2.2+e.ph)>0?.9:-.9)*(stop?0:1):Math.sin(G.time*1.7+e.ph)*(E.boss?.12:.28);   // きつねはジグザグ
    e.lean=wob; e.x=inArch(e.x+wob*f,e.y,e.r); e.born+=dt;
    if(E.call&&!e.fake&&!held){e.callT-=dt;if(e.callT<=0){e.callT=E.call;for(const t of E.calls)spawn(t,e);burst(e.x,e.y,E.color,14);sfx.warp()}}
    if(E.dorn&&!e.fake&&!held){e.dornT-=dt;if(e.dornT<=0){e.dornT=E.dorn;doDorn(e)}}
    if(E.hat&&!e.hatGone&&e.born>1&&!held) throwHat(e);
    if(e.y>=578-(E.boss?e.r*.6:0)){
      if(e.fake){vanishFake(e);continue}                     // にせものは受け皿に来てもドロンと消えるだけ
      const loss=E.boss===2?G.life:E.boss===1?5:1;
      e.dead=true; G.life-=loss; G.shake=E.boss?.8:.35; G.trayHurtAt=G.time; G.trayX=e.x;
      addText(e.x,562,'ライフ -'+loss,BERRY,true); burst(e.x,580,BERRY,E.boss?30:10); sfx.hurt();
    }
  }
  // タワー
  for(const p of G.pegs){
    const T=p.tower; if(!T) continue; const D=TOWERS[T.type];
    T.rapid=Math.max(0,T.rapid-dt); T.pow=Math.max(0,T.pow-dt); T.elT=Math.max(0,T.elT-dt); T.spT=Math.max(0,T.spT-dt); T.comboT=Math.max(0,T.comboT-dt);
    T.pop=Math.max(0,T.pop-dt); T.shot=Math.max(0,T.shot-dt); T.bump=Math.max(0,T.bump-dt); T.pull=Math.max(0,(T.pull||0)-dt); T.cd-=dt;
    if(T.gm==='spinner'){T.sw=Math.max(2.4,T.sw-dt*3);T.sa+=T.sw*T.sdir*dt}
    if(T.hat>0){T.hat-=dt;if(T.hat<=0)knockHat(p);continue}   // かかしの帽子をかぶっている間は撃てない
    if(T.doze>0){T.doze-=dt;continue}                          // きのこの胞子でねむっている間は撃てない
    if(T.bind>0){T.bind-=dt;if(T.bind<=0)unbind(p);continue}   // 大木の根っこにしばられている間は撃てない
    if(D.aoe){if(T.cd<=0)soundTower(p,T,D);continue}           // サウンドタワー：音の波
    // 砲身は、ねらっている敵の方へくるっと向く
    if(T.tg&&!T.tg.dead){let da=Math.atan2(T.tg.y-p.y,T.tg.x-p.x)-T.ang;da=Math.atan2(Math.sin(da),Math.cos(da));T.ang+=Math.max(-9*dt,Math.min(9*dt,da))}
    if(T.cd<=0){
      const R=D.range*(1+.08*(T.lv-1))*G.rscale; let best=null,by=-1;
      for(const e of G.en){if(e.dead||e.ghost>0)continue;const dx=e.x-p.x,dy=e.y-p.y;if(dx*dx+dy*dy<=R*R&&e.y>by){best=e;by=e.y}}   // すけすけの敵はねらえない
      if(best){
        const el=curEl(T), fx=T.comboT>0?{combo:T.combo}:T.spT>0?{sp:T.sp}:el?{el,lv:1}:null;
        const c=T.comboT>0?COMBO[T.combo].color:T.spT>0?SPECIAL[T.sp].color:el?ELEM[el].color:D.color;
        T.tg=best; T.ang=Math.atan2(best.y-p.y,best.x-p.x);
        const m=p.r*MUZ[T.type];
        G.bl.push({x:p.x+Math.cos(T.ang)*m,y:p.y+Math.sin(T.ang)*m,tg:best,dmg:D.dmg*(1+.4*(T.lv-1))*(T.pow>0?1.7:1)*(G.fever>0?2:1),c,fx,gone:false});
        T.cd=D.rate*Math.pow(.85,T.lv-1)*(T.rapid>0?.5:1)*(G.fever>0?.5:1); T.shot=.08;
      }else T.cd=.12;
    }
  }
  for(const u of G.bl){
    if(u.tg.dead){u.gone=true;continue}
    if(u.tg.ghost>0){u.gone=true;burst(u.x,u.y,'#ffffff',3);continue}   // すけすけになった敵には当たらない
    const dx=u.tg.x-u.x, dy=u.tg.y-u.y, d=Math.hypot(dx,dy), sp=7*f;
    if(d<=sp+u.tg.r*.5){
      const tg=u.tg, TE=ENEMIES[tg.t];
      if(TE.dodge&&!(tg.stun>0||tg.sleep>0||tg.root>0||tg.dodgeT>0)&&Math.random()<TE.dodge){dodge(tg,u);u.gone=true;continue}   // きつね：ひょいとよける
      hurtEnemy(tg,u.dmg);
      if(u.fx){if(u.fx.combo)applyCombo(tg,u.fx.combo,u.dmg);else if(u.fx.sp)applySpecial(tg,u.fx.sp,u.dmg);else applyEl(tg,u.fx.el,u.fx.lv,u.dmg)}
      u.gone=true;
    }
    else{u.x+=dx/d*sp;u.y+=dy/d*sp}
  }
  G.bl=G.bl.filter(u=>!u.gone);
  for(const z of G.zones){
    z.t-=dt;
    for(const e of G.en){if(e.dead)continue;const dx=e.x-z.x,dy=e.y-z.y;if(dx*dx+dy*dy>z.R*z.R)continue;
      if(z.k==='ice'){e.slowF=e.slow>0?Math.min(e.slowF||1,.28):.28;e.slow=Math.max(e.slow,.3)}
      else if(z.k==='thorn'){e.thorn=Math.max(e.thorn,.25);e.vineT=Math.max(e.vineT,.5)}
      else{e.psnD=Math.max(e.psnT>0?e.psnD||0:0,.7);e.psnT=Math.max(e.psnT||0,1.2)}}
  }
  G.zones=G.zones.filter(z=>z.t>0);
  // 森：ねむりきのこ・音の波・根っこ
  for(const m of G.mush){m.cd=Math.max(0,m.cd-dt);m.puff=Math.max(0,m.puff-dt);m.bop=Math.max(0,m.bop-dt)}
  for(const w of G.sw) w.t+=dt; G.sw=G.sw.filter(w=>w.t<w.max);
  stepRoots(dt);
  // かかしの帽子：ふわっと飛んで、砲台にすぽっ
  for(const h of G.hats){
    h.t+=dt; if(h.t<h.dur) continue;
    const T=h.p.tower; if(T&&!(T.hat>0)){T.hat=HAT_T;T.hatT=0;burst(h.p.x,h.p.y-8,'#f0d27a',6);sfx.hat();if(h.from&&!h.from.dead)h.from.laughT=1.4}   // かかしは大よろこび
  }
  G.hats=G.hats.filter(h=>h.t<h.dur);
  G.en=G.en.filter(e=>!e.dead);
  emitFx(dt);
  // フィーバー
  if(G.fever>0){
    G.fever-=dt;
    if(G.feverPay>0){G.feverPayT+=dt;while(G.feverPayT>.1&&G.feverPay>0){G.feverPayT-=.1;G.feverPay--;G.balls++}}
    if(G.fever<=0){G.fever=0;G.balls+=G.feverPay;G.feverPay=0}
  }
  for(const p of G.pegs) if(p.flash>0) p.flash-=dt;
  G.shake=Math.max(0,G.shake-dt); G.flash=Math.max(0,G.flash-dt);
  if(G.life<=0){G.life=0;gameOver();return}
  // ウェーブの区切り
  const cleared=!G.spawnQ.length&&!G.en.length&&!G.pend.length;
  if(G.wave>=WAVES){if(cleared){stageClear();return}}
  else{
    G.waveT-=dt;
    if(cleared&&!G.waveDone){G.waveDone=true;G.waveGap=2.5;G.balls+=15;addText(190,300,'WAVE クリア +15',GOLD,true);cheerRun(GOLD)}
    if(G.waveDone?(G.waveGap-=dt)<=0:G.waveT<=0) startWave(G.wave+1);
  }
}

function updateFx(dt){
  const f=dt*60;
  for(const q of G.parts){q.x+=q.vx*f;q.y+=q.vy*f;q.vy+=.05*f;q.t-=dt}

  for(const r of G.rings) r.t-=dt; G.rings=G.rings.filter(r=>r.t>0);
  for(const p of G.portals) p.age+=dt; G.portals=G.portals.filter(p=>p.age<p.dur);
  for(const q of G.poofs) q.t+=dt; G.poofs=G.poofs.filter(q=>q.t<.5);
  for(const h of G.hatFly){h.x+=h.vx*f;h.y+=h.vy*f;h.vy+=.12*f;h.rot+=h.vr*dt;h.t-=dt} G.hatFly=G.hatFly.filter(h=>h.t>0);

/* ---------- 台のまわり（余白）の盛り上がり ---------- */
// いまの場面：警告（中ボス・ボスが出た）＞ FEVER ＞ クリア ＞ ウェーブの区切り ＞ ボスがいる ＞ ピンチ（ライフ3以下）
function cheerRun(c){G.cheer=G.cheerMax=1.1;G.cheerC=c}
function marginMode(){

  if(G.fever>0) return 'fever';
  if(G.state==='clear') return 'clear';
  if(G.cheer>0) return 'cheer';
  const B=G.en.find(e=>ENEMIES[e.t].boss); if(B){G.bossC=ENEMIES[B.t].color;return 'boss'}

const beat=t=>Math.pow(Math.max(0,Math.sin(t*6.3)),10)+.6*Math.pow(Math.max(0,Math.sin(t*6.3-.9)),10);   // どくん、どくん
// 台のふち（木の段）にそってならぶランプ：左下 → 左の柱 → 上のアーチ → 右の柱 → 右下
let rimLamps=null;
function rimPts(){
  if(rimLamps) return rimLamps;
  const r=RO+5, side=H-8-CY, arc=Math.PI*r, L=side*2+arc, n=Math.round(L/15), o=[];
  for(let i=0;i<n;i++){
    const s=(i+.5)/n*L; let x,y;
    if(s<side){x=CX-r;y=H-8-s}
    else if(s<side+arc){const a=Math.PI+(s-side)/r;x=CX+r*Math.cos(a);y=CY+r*Math.sin(a)}
    else{x=CX+r;y=CY+(s-side-arc)}

  }

}
// 台の外（余白）かどうか
function inField(x,y,m){return y<CY?Math.hypot(x-CX,y-CY)<RO+m:Math.abs(x-CX)<RO+m&&y<H+m}
function marginPt(){const V=view();for(let k=0;k<6;k++){const x=V.x0+Math.random()*(V.x1-V.x0),y=V.y0+Math.random()*(V.y1-V.y0);if(!inField(x,y,10))return[x,y]}return null}
function updateMargin(dt){
  const f=dt*60;

  const mode=marginMode(), rate={fever:64,clear:54,alarm:44,cheer:30,boss:9,pinch:7}[mode]||0;
  // きらきら・火の粉
  for(let n=fxN(rate,dt);n>0&&G.msp.length<280;n--){
    const p=marginPt(); if(!p) continue;

    const up=mode==='alarm'||mode==='boss'||mode==='pinch';
    G.msp.push({x:p[0],y:p[1],vx:(Math.random()-.5)*.3,vy:up?-.7-Math.random()*.5:-.2-Math.random()*.3,c,t:.9,ph:Math.random()*6,big:Math.random()<.25});
  }

      const p=marginPt(); if(!p) continue;

  for(const q of G.conf){q.x+=(q.vx+Math.sin(G.time*3+q.ph)*.35)*f;q.y+=q.vy*f;q.rot+=q.vr*f;q.t-=dt}

// サーチライト：台のうしろから、四すみの光が ゆれながら交差する（台の中にはかからない）
function drawBeams(mode,t,V){
  const cfg={fever:[4,1.6,.24],clear:[4,.9,.22],alarm:[4,2.6,0],boss:[2,.55,.13]}[mode]; if(!cfg) return;
  const [n,sp,al0]=cfg, len=760;
  for(let i=0;i<n;i++){
    const left=i%2===0, top=i>=2;
    const ox=left?V.x0+4:V.x1-4, oy=top?V.y0-4:V.y1+4;
    const base=top?(left?Math.PI*.5-.5:Math.PI*.5+.5):(left?-Math.PI*.5+.5:-Math.PI*.5-.5);
    const a=base+(reduce?0:.42*Math.sin(t*sp+i*1.9)*(left?1:-1));
    const c=mode==='fever'?RAINBOW[(i*2+Math.floor(t*2))%6]:mode==='clear'?(i%2?GOLD:'#fff3b0'):mode==='alarm'?G.alarmC:G.bossC;
    const al=mode==='alarm'?(reduce?.16:(Math.floor(t*5)+i)%2?.3:.08):al0, w=.085;
    const g=ctx.createLinearGradient(ox,oy,ox+Math.cos(a)*len,oy+Math.sin(a)*len);
    g.addColorStop(0,hexA(c,al)); g.addColorStop(.6,hexA(c,al*.35)); g.addColorStop(1,hexA(c,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(ox,oy);

    glow(c,ox,oy,22,Math.min(1,al*3));

// 警告のしましま（中ボス・ボス出現の間、画面の上と下を流れる）
function drawStripes(t,V){

// 光のかたまり（四すみ・上・左右の柱・下）の色と明るさ
function washOf(mode,i,t){
  switch(mode){
    case 'fever': return [RAINBOW[(i+Math.floor(t*6))%6],.42+.22*Math.sin(t*8+i*1.3)];
    case 'alarm': return [G.alarmC,reduce?.45:(Math.floor(t*5)+i)%2?.68:.12];
    case 'clear': return [i%2?GOLD:'#fff0a6',.32+.18*Math.sin(t*3+i)];
    case 'cheer': return [G.cheerC,.34*G.cheer/G.cheerMax];
    case 'boss': return [G.bossC,.1+.26*beat(t)];
    case 'pinch': return ['#ff4f5e',.08+.22*beat(t)];
  }
  return [0,0];
}
// ふちのランプ1つの色と明るさ（u＝左下0 → 上のまん中.5 → 右下1）
function lampOf(mode,u,i,t){
  switch(mode){
    case 'fever': return [RAINBOW[(i+Math.floor(t*14))%6],.3+.7*Math.max(0,Math.sin(u*50-t*12))];
    case 'alarm': return [G.alarmC,reduce?.6:(Math.floor(t*5)+i)%2?.95:.08];
    case 'clear': return [i%3?GOLD:'#ffffff',.35+.6*Math.max(0,Math.sin(u*31-t*6))];
    case 'cheer': {const p=1-G.cheer/G.cheerMax, d=1-Math.abs(2*u-1);return [G.cheerC,Math.max(0,1-Math.abs(d-p*1.15)*6)*.95]}
    case 'boss': {const h=(t*.28)%1, d=Math.min(Math.abs(u-h),1-Math.abs(u-h));return [G.bossC,Math.max(0,1-d*10)*.8+.3*beat(t)]}
    case 'pinch': return ['#ff4f5e',.06+.45*beat(t)];
  }

function drawMargin(t){
  const mode=marginMode();

  const V=view();
  ctx.save();
  // 台の中はくりぬく（ふちの木の段から外だけ）
  ctx.beginPath(); ctx.rect(V.x0-4,V.y0-4,V.x1-V.x0+8,V.y1-V.y0+8);

}
// 台の形（左下 → 左の柱 → 上のアーチ → 右の柱 → 右下）にそった点。u は 0〜1
function rimAt(u,r,bottom){
  const side=bottom-CY, arc=Math.PI*r, L=side*2+arc, s=u*L;
  if(s<side) return [CX-r,bottom-s];
  if(s<side+arc){const a=Math.PI+(s-side)/r;return [CX+r*Math.cos(a),CY+r*Math.sin(a)]}

// FEVER の虹の枠：台の形にそって。太い虹の光がどくどく脈打ち、白い光の玉が虹の尾を引いて走る（14回目）

  let st=c;
  if(ctx.createConicGradient){const g=ctx.createConicGradient(t*3.2,CX,CY+150);RAINBOW.concat(RAINBOW[0]).forEach((col,i)=>g.addColorStop(i/6,col));st=g}
  const B=H+2, path=r=>{ctx.beginPath();ctx.moveTo(CX-r,B);ctx.lineTo(CX-r,CY);ctx.arc(CX,CY,r,Math.PI,Math.PI*2);ctx.lineTo(CX+r,B);ctx.closePath()};
  const pulse=reduce?1:1+.22*Math.sin(t*9);
  ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=st;
  ctx.globalCompositeOperation='lighter';

  ctx.globalAlpha=.75; ctx.lineWidth=9; path(RO+4); ctx.stroke();
  ctx.globalCompositeOperation='source-over';

}

// ギミック（砲台の下）：バンパー＝白い輪（当たるとふくらんで光る）、回転十字＝まわる4本のうで
function drawGimmick(p,T){
  const R=p.r, x=p.x, y=p.y;
  if(T.gm==='bumper'){
    const k=T.bump>0?T.bump/.25:0, rr=R+BUMP_R-1.4+k*2.2;
    ctx.globalCompositeOperation='lighter'; glow('#dff0ff',x,y,rr*1.7,.16+.55*k); ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle='#8f9aab'; ctx.lineWidth=3.6; circle(x,y,rr); ctx.stroke();
    ctx.strokeStyle=k>0?'#ffffff':'#dfe6ee'; ctx.lineWidth=1.6; circle(x,y,rr); ctx.stroke();
  }else if(T.gm==='ivy'){
    // 引きよせツタ：杭のまわりを巻くつたと葉っぱ。玉を引きよせているときは、つるが玉へのびる
    const t=G.time;
    ctx.globalCompositeOperation='lighter'; glow('#7ee36a',x,y,R+IVY_R*.6,.1+(T.pull>0?.18:0)); ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle='#2f6a32'; ctx.lineWidth=2.6; ctx.beginPath();
    for(let i=0;i<=48;i++){const a=i/48*Math.PI*2, rr=R+3.2+Math.sin(a*4+t*1.5)*1.6;i?ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):ctx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}
    ctx.closePath(); ctx.stroke(); ctx.strokeStyle='#7ee36a'; ctx.lineWidth=.9; ctx.stroke();
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2+.3+Math.sin(t*1.2+i)*.12;leaf(ctx,x+Math.cos(a)*(R+3.5),y+Math.sin(a)*(R+3.5),a,6,i%2?'#4fb45a':'#6fd06a')}
    const b=T.pullB;
    if(T.pull>0&&b&&!b.gone){
      const dx=b.x-x, dy=b.y-y, d=Math.hypot(dx,dy)||1, sx=x+dx/d*(R+3), sy=y+dy/d*(R+3), mx=(sx+b.x)/2-dy/d*6, my=(sy+b.y)/2+dx/d*6;
      ctx.globalAlpha=Math.min(1,T.pull*8); ctx.strokeStyle='#8ff07a'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(mx,my,b.x-dx/d*b.r,b.y-dy/d*b.r); ctx.stroke(); ctx.globalAlpha=1;
    }
  }else if(T.gm==='spinner'){
    const L=R+SPIN_L;
    ctx.lineCap='round';
    for(let i=0;i<4;i++){
      const a=T.sa+i*Math.PI/2, ex=x+Math.cos(a)*L, ey=y+Math.sin(a)*L;
      ctx.strokeStyle='#5d6878'; ctx.lineWidth=4.2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.strokeStyle='#d9dfe7'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*R*.7,y+Math.sin(a)*R*.7); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.fillStyle='#eef1f5'; circle(ex,ey,2.4); ctx.fill(); ctx.strokeStyle=GUN.dark; ctx.lineWidth=.8; ctx.stroke();
    }
  }
}
// タワー：杭の上に砲台。下の点がレベル
function drawTower(p,t){

  if(col){

    ctx.strokeStyle=col; ctx.lineWidth=big?3:2;
    ctx.beginPath(); ctx.arc(p.x,p.y,R+13,-Math.PI/2,-Math.PI/2+left*Math.PI*2); ctx.stroke();
    if(big){ctx.setLineDash([2,5]);ctx.lineDashOffset=t*24;circle(p.x,p.y,R+17);ctx.stroke();ctx.setLineDash([]);ctx.lineDashOffset=0}

    if(T.comboT>0){

  if(T.pow>0){ctx.fillStyle=BALLS.lead.color;for(const dx of [-1,1]){const x=p.x+dx*(R+11),y=p.y+2;ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x+4,y+2);ctx.lineTo(x-4,y+2);ctx.closePath();ctx.fill()}}
  if(T.rapid>0){ctx.setLineDash([3,4]);ctx.lineDashOffset=-t*30;ctx.strokeStyle=hexA('#f4f1e8',.9);ctx.lineWidth=1.6;circle(p.x,p.y,R+8);ctx.stroke();ctx.setLineDash([]);ctx.lineDashOffset=0}
}
/* ---------- 森の動く絵：ねむりきのこ・根っこ・音の波・はちみつのツボ ---------- */
// ねむりきのこ：光っているときは胞子が出る。使ったあとは暗くなって、まわりの弧でまた光るまでを見せる

// 根っこ：大木から地面の下を通って（土のひび）、砲台の足もとから根っこがのびる
function drawRoots(t,front){
  for(const r of G.roots){
    const p=r.p, u=Math.min(1,r.t/r.dur), fade=r.t>r.dur?1-(r.t-r.dur)/.35:1;
    if(!front){
      ctx.globalAlpha=.7*fade; ctx.strokeStyle='#2a170a'; ctx.lineWidth=2.4; ctx.setLineDash([5,4]);
      const x=r.x0+(p.x-r.x0)*u, y=r.y0+(p.y+p.r-r.y0)*u;
      ctx.beginPath(); ctx.moveTo(r.x0,r.y0); ctx.lineTo(x,y); ctx.stroke(); ctx.setLineDash([]);
      if(r.t<r.dur&&Math.random()<.5) G.parts.push({x,y,vx:(Math.random()-.5)*1.5,vy:-1.2,t:.35,c:'#8a5a33'});
      ctx.globalAlpha=1; continue;
    }
    if(u<.55) continue;
    const g=(u-.55)/.45;
    ctx.globalAlpha=fade; ctx.lineCap='round';
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+(i-2)*.55, L=p.r*(.8+.9*g)*(i%2?.8:1.1), bx=p.x+Math.cos(a+Math.PI)*p.r*.6, by=p.y+p.r*.9;
      ctx.strokeStyle='#5a3a1c'; ctx.lineWidth=3.2-i%2;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.quadraticCurveTo(bx+Math.cos(a)*L*.4+Math.sin(t*20+i)*1,by-L*.5,p.x+Math.cos(a)*L*.7,p.y-L*.6+p.r*.5); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}
// 根っこにしばられた砲台（杭のまわりに根っこが巻きつく。のこり時間の弧）

// ねむっている砲台：うすいピンクのもやと Zz

// サウンドタワーの音の波（2重の輪がひろがる）

// はちみつのツボ

/* ---------- セーブ（台えらび・お店・台のクリアのときに、この端末へ保存） ---------- */
// 台の中では保存しない。ゲームオーバーのときは、台に入る前の保存にもどる
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,balls:G.balls,deck:G.deck,owned:G.owned,unlocked:G.unlocked,gimmicks:G.gimmicks,cleared:G.cleared,kills:G.kills}))}catch(_){}}
function readSave(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(!s||!Array.isArray(s.deck)) return null;
    const old={bounce:'bb',big:'lead'}; s.deck=s.deck.map(k=>old[k]||k).filter(k=>BALLS[k]); if(!s.deck.length) return null;
    if(s.v!==2) s.cleared=typeof s.cleared==='number'?Array.from({length:s.cleared+1},(_,i)=>i):[];   // 前の形（○面クリア後）からのひきつぎ
    s.cleared=(s.cleared||[]).filter(i=>STAGES[i]);
    // 前の形（セットに入れた玉＝持っている玉）からのひきつぎ：セットの特殊な玉を持ち玉にして、セットは5つにそろえる
    if(!s.owned||typeof s.owned!=='object'){s.owned={};for(const k of s.deck) if(k!=='normal') s.owned[k]=(s.owned[k]||0)+1}
    for(const k of Object.keys(s.owned)) if(!BALLS[k]||k==='normal') delete s.owned[k];
    s.deck=fitDeck(s.deck,s.owned);
    return s;
  }catch(_){}
  return null;
}
function loadSave(){
  const s=readSave(); if(!s) return false;
  G.balls=Math.max(0,s.balls|0); G.deck=s.deck.slice(); G.unlocked=Object.assign(NEW_UNLOCKED(),s.unlocked||{});
  G.gimmicks=Object.assign(NEW_GIMMICKS(),s.gimmicks||{}); G.cleared=s.cleared.slice(); G.kills=s.kills|0;
  G.owned={...s.owned}; G.deck=s.deck.slice();
  return true;
}
function continueRun(){if(!loadSave()){newRun();return} openHub('board')}

/* ---------- 流れ：タイトル → ロビー（台えらび）→ 台であそぶ → クリアでロビーへ ---------- */
function newRun(){
  G.balls=START_COINS; G.deck=START_DECK.slice(); G.owned={...START_OWNED}; G.unlocked=NEW_UNLOCKED(); G.gimmicks=NEW_GIMMICKS(); G.cleared=[]; G.kills=0;
  openHub('board');
}
const boardName=b=>b.soon?b.name:STAGES[b.stage].name;
function playBoard(i){
  closeBuy(); G.stage=BOARDS[i].stage; G.boardIdx=i; hallIdx=i;
  const add=Math.max(0,MIN_COINS-G.balls); G.balls+=add;      // 打てなくならないように、少ないときは足す
  writeSave(); startStage();
  if(add>0) addText(70,40,`コイン +${add}`,GOLD,true);
}
function startStage(){
  setupStage(); hideOverlays(); closeSheet(); G.alarm=0; G.cheer=0; G.msp=[];
  G.state='play'; G.spawnQ=[]; startWave(1);
  const S=STAGES[G.stage]; banner(`${S.name}の台`+(S.kind?'・'+S.kind:''),S.accent,2.2,200);
}
function stageClear(){
  G.state='clear'; G.fever=0; G.bs=[]; G.bl=[];
  const bonus=30+G.life*3; G.balls+=bonus; sfx.fever(); burst(188,300,'rainbow',30);
  const S=STAGES[G.stage], first=!G.cleared.includes(G.stage);
  if(first) G.cleared.push(G.stage);
  writeSave();
  const lines=[`のこりライフ ${G.life}`,`クリアボーナス ${COIN}+${bonus}`,`お金 ${COIN}${G.balls}`,'ここまでセーブしたよ'];
  // はじめてクリアで次の台が開いたら、お知らせ（お店にふえた品も）
  if(first) for(const B of BOARDS) if(B.need===G.stage){lines.push(`<b class="newb">${STAGES[B.stage].name}の台が開いたよ！</b>`);const n=newItems(B.stage);if(n.length)lines.push(`お店に ${n.join('・')} がふえた`)}
  showResult(`${S.name}の台 クリア！`,lines,'台えらびへ',()=>{hallIdx=Math.min(BOARDS.length-1,(G.boardIdx??0)+(first?1:0));openHub('board')},'お店へ',()=>openHub('ball'));
}
function gameOver(){
  G.state='over'; closeSheet(); G.balls+=G.feverPay; G.feverPay=0; G.fever=0; writeSave();
  const S=STAGES[G.stage], i=G.boardIdx??0;
  showResult('ゲームオーバー',[`${S.name}の台 WAVE ${G.wave} まで守った`,`お金 ${COIN}${G.balls}`,'かせいだお金はそのまま残るよ。お店で強くなって、もう一度！'],
    'もう一度この台',()=>playBoard(i),'台えらびへ',()=>openHub('board'));
}

/* ---------- 持ち玉とセット ---------- */
// セットはいつも5つ。持っている数より多くは入れられない。あいた所はノーマル玉
function fitDeck(deck,owned){
  const use={}, out=[];
  for(const k of deck){if(out.length>=DECK_N)break;if(k==='normal'||!BALLS[k])continue;if((use[k]||0)<(owned[k]||0)){use[k]=(use[k]||0)+1;out.push(k)}}
  while(out.length<DECK_N) out.push('normal');
  return out;
}
const inSet=k=>G.deck.filter(x=>x===k).length;

/* ---------- ロビー（夜のゲームセンター）：下のタブで 台・玉・タワー・ギミック・セット ---------- */
const TABS={board:'台えらび',ball:'お店・玉',tower:'お店・タワー',gimmick:'お店・ギミック',set:'玉のセット'};
const SHOP_BALLS=['lead','bb','heal','fire','ice','bolt','poison','water','vine'];   // 無属性弾 → 回復弾 → 属性弾（森の品は森が開いてから）
const SHOP_TOWERS=['basic','fire','ice','bolt','poison','long','water','sound'];
let hubTab='board', toastT=0;

  writeSave(); hideOverlays(); $('hub').classList.remove('sitting'); $('hub').hidden=false; showTab(tab||hubTab);
}
function showTab(tab){

for(const b of $('tabs').children) b.onclick=()=>{ensureAudio();sfx.tick();showTab(b.dataset.tab)};
function setCoins(spend){

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;t.style.animation='none';void t.offsetWidth;t.style.animation='';clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function renderTab(){
