const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
function paint(e,color){e.style.setProperty('--c',color);e.style.setProperty('--cg',hexA(color,.36));e.style.setProperty('--cs',hexA(color,.15))}
// カード：アイコン・名前・説明・値段（または「持ってる」）。タップで買う前のシート
function card(o){
  const c=el('button','card'); paint(c,o.color);
  if(o.row) c.classList.add('row');
  c.innerHTML=`<span class="ico"><img alt="" src="${o.icon}"></span>${o.cnt?`<span class="cnt">${o.cnt}</span>`:''}<span class="mid"><span class="nm">${o.name}</span><span class="ds">${o.desc}</span></span>`+
    (o.own?`<span class="tagown">${o.own}</span>`:o.price!=null?`<span class="price${G.balls<o.price?' short':''}">${COIN}${o.price}</span>`:'');
  c.onclick=()=>{ensureAudio();o.tap()}; return c;
}
// アイコンは台と同じ絵（玉・砲台・ギミック）をキャンバスに描いて使う
const iconCache=new Map();
function icon(kind,k){
  const key=kind+':'+k; if(iconCache.has(key)) return iconCache.get(key);
  const cvs=document.createElement('canvas'); cvs.width=cvs.height=160;
  const g=cvs.getContext('2d'), keep=ctx; ctx=g; g.lineCap='round';
  try{
    if(kind==='ball'){
      const B=BALLS[k], r=k==='lead'?40:k==='bb'?27:34;
      g.setTransform(1,0,0,1,80,78);
      g.globalCompositeOperation='lighter'; glow(B.color,0,0,74,B.el?.7:.35); g.globalCompositeOperation='source-over';
      drawBall({x:0,y:0,r,t:k});
    }else{
      const p={x:0,y:0,r:11};
      g.setTransform(kind==='tower'?3.2:3.05,0,0,kind==='tower'?3.2:3.05,80,kind==='tower'?90:80);
      g.globalCompositeOperation='lighter'; glow(kind==='tower'?TOWERS[k].color:'#bfe6ff',0,0,30,.4); g.globalCompositeOperation='source-over';
      drawStake(g,0,0,11);
      if(kind==='gimmick') drawGimmick(p,{gm:k,bump:0,sa:Math.PI/7});
      drawGun(p,{type:kind==='tower'?k:'basic',ang:kind==='tower'?-Math.PI/4:-Math.PI/2,shot:0},0);
    }
  }finally{ctx=keep}
  const url=cvs.toDataURL(); iconCache.set(key,url); return url;
}

// 台のタブ：いまのセットと、台のカード
function setStrip(){
  const d=el('div','setstrip'); d.append(el('span',null,'いまのセット'));
  const m=el('div','minis'); for(const k of G.deck){const i=new Image();i.alt=BALLS[k].name;i.src=icon('ball',k);m.append(i)} d.append(m);
  const b=el('button','linkbtn','へんしゅう'); b.onclick=()=>{ensureAudio();showTab('set')}; d.append(b);
  return d;
}
// 台の顔（台を描いた静止画をまるごと切りぬく）。台ごとに1回だけ作る
const faceCache=new Map();
function boardFace(B){
  if(B.soon) return null;
  if(faceCache.has(B.stage)) return faceCache.get(B.stage);
  let url=null; const keep=G.stage;
  try{
    G.stage=B.stage; setupStage();
    const k=scale*dpr, c=document.createElement('canvas'); c.width=432; c.height=720;
    c.getContext('2d').drawImage(staticCv,ox*dpr,oy*dpr,W*k,H*k,0,0,c.width,c.height); url=c.toDataURL('image/jpeg',.85);
  }catch(_){url=null}
  G.stage=keep; setupStage();
  if(url) faceCache.set(B.stage,url); return url;
}
// 台のタブ：パチンコ屋さんのホールのように、台が目の前にならぶ。左右にスワイプで台をかえて、まん中の台をタップで座る
let hallIdx=0, hallRO=null;
function tabBoard(body){
  body.classList.add('hall');
  body.append(setStrip());
  hallIdx=Math.max(0,Math.min(BOARDS.length-1,hallIdx));
  const wrap=el('div','hallwrap'), aisle=el('div','aisle');
  aisle.setAttribute('aria-label','台のならび（左右にスワイプ）');
  const slots=BOARDS.map((B,i)=>{
    const lock=!B.soon&&!stageOpen(B.stage), nc=B.soon?'#5a5278':STAGES[B.stage].accent, done=!B.soon&&G.cleared.includes(B.stage), face=boardFace(B);
    const s=el('div','slot'+(B.soon?' soon':'')); s.style.setProperty('--nc',nc); s.style.setProperty('--ng',hexA(nc,B.soon?.12:.45));
    const cab=el('button','cab');
    cab.setAttribute('aria-label',B.soon?`まだ遊べない台（アンロック ${B.price}コイン）`:lock?`${boardName(B)}の台（${STAGES[B.need].name}の台をクリアすると開く）`:`${boardName(B)}の台に座る`);
    cab.innerHTML=`<span class="topper"><span class="tno">NO.${i+1}</span><span class="tname"><b>${B.soon?'？？？':boardName(B)+'<small>の台</small>'}</b></span>${done?'<span class="stamp">CLEAR</span>':''}</span>`+
      `<span class="cframe"><span class="cface" style="background:${face?`url(${face})`:B.thumb}">${B.soon?'<span class="shutter">COMING<br>SOON</span>':lock?`<span class="shutter lockd">${STAGES[B.need].name}の台を<br>クリアで開く</span>`:''}</span></span>`;
    const go=()=>{ensureAudio(); if(i!==hallIdx){goSlot(i,true);return} if(B.soon) openBoardBuy(i); else if(lock) openBoardLock(i); else sit(i)};
    cab.onclick=go;
    s.append(cab); aisle.append(s);
    return s;
  });
  wrap.append(aisle); body.append(wrap);
  const center=i=>slots[i].offsetLeft+slots[i].offsetWidth/2-aisle.clientWidth/2;
  function mark(){
    slots.forEach((s,j)=>s.classList.toggle('cur',j===hallIdx));
  }
  function goSlot(i,smooth){hallIdx=i; mark(); aisle.scrollTo({left:center(i),behavior:smooth?'smooth':'auto'})}
  // 台の大きさ：ホールの高さいっぱいに（となりの台が少し見える幅まで）
  function layout(){
    const h=aisle.clientHeight, w=aisle.clientWidth; if(!h||!w) return;
    const cw=Math.round(Math.max(90,Math.min((h-18-12)/1.82,w*.82,480)));   // 下に18pxのすきま（ネオンの光が下まで見えるように）
    wrap.style.setProperty('--cw',cw+'px'); wrap.style.setProperty('--gap',Math.round(cw*.05)+'px');
    aisle.scrollLeft=center(hallIdx);
  }
  aisle.addEventListener('scroll',()=>{
    if(wrap.classList.contains('sit')) return;
    const c=aisle.scrollLeft+aisle.clientWidth/2; let best=hallIdx,bd=1e9;
    slots.forEach((s,j)=>{const d=Math.abs(s.offsetLeft+s.offsetWidth/2-c);if(d<bd){bd=d;best=j}});
    if(best!==hallIdx){hallIdx=best;sfx.tick();mark()}
  },{passive:true});
  function sit(i){
    if(wrap.classList.contains('sit')) return;
    sfx.build(); wrap.classList.add('sit'); $('hub').classList.add('sitting');
    setTimeout(()=>{playBoard(i);$('hub').classList.remove('sitting')},560);
  }
  mark();
  try{hallRO=new ResizeObserver(layout);hallRO.observe(aisle)}catch(_){layout()}
  requestAnimationFrame(layout);
}

function equip(k){

let buyFn=null;
function openBuy(kind,k){

  const y=$('buyYes');

// まだできていない台：値段と「アンロックしますか？」を出す（中身ができるまでボタンは押せない）
let soonIco=null;
function openBoardBuy(i){
  const B=BOARDS[i]; paint($('buyIn'),'#ff4fd8');
  if(!soonIco){
    const c=document.createElement('canvas'); c.width=c.height=160; const g=c.getContext('2d');
    g.shadowColor='#ff4fd8'; g.shadowBlur=14; g.strokeStyle='#ff8ae6'; g.lineWidth=5; g.lineJoin='round';
    g.beginPath(); g.moveTo(40,140); g.lineTo(40,62); g.arc(80,62,40,Math.PI,0); g.lineTo(120,140); g.closePath(); g.stroke();
    g.shadowBlur=10; g.fillStyle='#fff'; g.font='bold 54px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('?',80,92);
    soonIco=c.toDataURL();
  }
  $('buyIco').src=soonIco; $('buyKind').textContent='BOARD NO.'+(i+1); $('buyName').textContent=B.name+'の台';
  $('buyDesc').textContent='この台をアンロックしますか？ '+B.desc;
  $('buyNote').textContent='まだ準備中。できたらアンロックできるようになるよ';
  const y=$('buyYes'); y.disabled=true; y.innerHTML=`${COIN}${B.price} でアンロック`; buyFn=null;
  $('buy').hidden=false; $('buyNo').focus();
}
// まだ開いていない台（前の台をクリアすると開く）：開いたらお店にふえる品を見せる
function openBoardLock(i){
  const B=BOARDS[i], S=STAGES[B.stage]; paint($('buyIn'),S.accent);
  $('buyIco').src=boardFace(B)||soonIco||''; $('buyKind').textContent='BOARD NO.'+(i+1); $('buyName').textContent=S.name+'の台';
  $('buyDesc').textContent=`${STAGES[B.need].name}の台をクリアすると、遊べるようになるよ。${B.desc}`;
  $('buyNote').textContent='開くと、お店にふえる：'+newItems(B.stage).join('・');
  const y=$('buyYes'); y.disabled=true; y.textContent=`${STAGES[B.need].name}の台をクリアしてね`; buyFn=null;
  $('buy').hidden=false; $('buyNo').focus();
}
// その台が開くと お店にふえる品の名前
const newItems=st=>[...Object.values(BALLS),...Object.values(TOWERS),...Object.values(GIMMICKS)].filter(D=>D.board===st).map(D=>D.name);
function closeBuy(){$('buy').hidden=true;buyFn=null}
function buy(kind,k,price){
  if(G.balls<price) return;
  G.balls-=price; closeBuy(); setCoins(true);
  let msg;
  if(kind==='ball'){
    G.owned[k]=(G.owned[k]||0)+1; const i=G.deck.indexOf('normal');
    if(i>=0){G.deck[i]=k;msg=`${BALLS[k].name}をGET！ セットに入れたよ`}else msg=`${BALLS[k].name}をGET！ 持ち玉に入ったよ（セットで入れかえてね）`;
    sfx.build();
  }else if(kind==='tower'){G.unlocked[k]=true;msg=`${TOWERS[k].name}をGET！ 杭をタップして建てられるよ`;sfx.lv()}
  else{G.gimmicks[k]=true;msg=`${GIMMICKS[k].name}をGET！ 台で砲台をタップしてつけてね`;sfx.lv()}
  writeSave(); renderTab(); toast(msg);
}
$('buyYes').onclick=()=>{ensureAudio();if(buyFn)buyFn()};
$('buyNo').onclick=closeBuy; $('buyBack').onclick=closeBuy;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('buy').hidden)closeBuy()});

/* ---------- 釘をタップ ---------- */
function openBuild(p){
  G.sel=p; G.paused=true;
  $('sheetTitle').textContent='この杭にタワーを建てる';
  const body=$('sheetBody'); body.textContent='';
  for(const k of Object.keys(TOWERS)){
    const t=TOWERS[k]; if(!avail(t)) continue;
    if(G.unlocked[k]){
      body.append(towerRow(k,t.cost,G.balls>=t.cost,()=>{
        G.balls-=t.cost; p.tower={type:k,lv:1,xp:0,cd:.3,rapid:0,pow:0,el:null,elT:0,sp:null,spT:0,combo:null,comboT:0,pop:.3,shot:0,
          ang:-Math.PI/2,tg:null,gm:null,bump:0,sa:0,sw:2.4,sdir:p.x<180?-1:1};
        p.r=Math.max(p.r,7);   // ang＝砲身の向き（はじめは上）。gm＝ギミック。回転十字は左半分なら左回り（下のうでがまん中へ動く）
        buildStatic(); burst(p.x,p.y,t.color,16); sfx.build(); closeSheet();
      }));
    }else{
      const row=towerRow(k,'—',false); row.classList.add('locked'); row.querySelector('.gauges').outerHTML='<div class="d">お店で手に入るよ</div>'; row.querySelector('.tags')?.remove(); body.append(row);
    }
  }
  $('sheet').hidden=false;
}
// 砲台の強さ（いまのレベル・バフ・FEVER をふくむ）を5つの点に。[いま, もとの強さ]（ふえた分は金色）
function towerGauge(k,lv,T){
  const D=TOWERS[k], d5=v=>Math.max(1,Math.min(5,Math.round(v)));
  const dmg=D.dmg*(1+.4*(lv-1)), iv=D.rate*Math.pow(.85,lv-1), rg=D.range*(1+.08*(lv-1))*G.rscale;
  const pm=(T&&T.pow>0?1.7:1)*(G.fever>0?2:1), rm=(T&&T.rapid>0?.5:1)*(G.fever>0?.5:1);
  return [['威力',d5(dmg*pm/1.45),d5(dmg/1.45)],['射程',d5(rg/40),d5(rg/40)],['連射',d5(2/(iv*rm)),d5(2/iv)]];
}
const pips=(n,nb)=>{let h='<span class="pips">';for(let i=0;i<5;i++)h+=`<i class="${i<nb?'on':i<n?'up':''}"></i>`;return h+'</span>'};
const gaugeHtml=(k,lv,T,mini)=>`<div class="gauges${mini?' mini':''}" style="--tc:${TOWERS[k].color}">`+towerGauge(k,lv,T).map(([l,n,nb])=>`<span class="gg"><span class="gl">${l}</span>${pips(n,nb)}</span>`).join('')+'</div>';
// タグ：属性・とくしゅ効果・わざ・強撃（攻撃UP）・速射（連射UP）。下の細い線がのこり時間
const EL_TAG={fire:'火炎',ice:'氷結',bolt:'雷',poison:'毒',water:'水',vine:'つる'};
function towerTags(k,T){
  const D=TOWERS[k], o=[];
  if(D.el) o.push([EL_TAG[D.el],ELEM[D.el].color]);
  if(D.aoe) o.push(['はんい',D.color]);
  if(T){
    if(T.elT>0&&T.el&&T.el!==D.el) o.push([EL_TAG[T.el],ELEM[T.el].color,T.elT]);
    if(T.spT>0) o.push([SPECIAL[T.sp].name,SPECIAL[T.sp].color,T.spT]);
    if(T.comboT>0) o.push([COMBO[T.combo].name,COMBO[T.combo].color,T.comboT]);
    if(T.pow>0) o.push(['強撃','#ffb36b',T.pow]);
    if(T.rapid>0) o.push(['速射','#7ff3ff',T.rapid]);
    if(G.fever>0) o.push(['FEVER',GOLD]);
  }
  return o.length?'<div class="tags">'+o.map(([t,c,left])=>`<span class="tg" style="--c:${c}">${t}${left!=null?`<i style="width:${Math.max(4,Math.min(100,left/BUFF_T*100))|0}%"></i>`:''}</span>`).join('')+'</div>':'';
}
function towerRow(k,price,enabled,onBuy){
  const t=TOWERS[k], row=document.createElement('div'); row.className='item trow';
  row.innerHTML=`<img class="tico" alt="" src="${icon('tower',k)}"><div><div class="t">${t.name}</div>${gaugeHtml(k,1,null,true)}${towerTags(k,null)}</div>`;
  const b=document.createElement('button'); b.className='buy'; b.innerHTML=typeof price==='number'?COIN+price:price; b.disabled=!enabled; if(onBuy)b.onclick=onBuy; row.append(b); return row;
}
function openInfo(p){
  const T=p.tower, D=TOWERS[T.type];
  G.sel=p; G.paused=true;
  $('sheetTitle').textContent=`${D.name} Lv${T.lv}`;
  const body=$('sheetBody'); body.textContent='';
  const info=document.createElement('div'); info.className='tinfo';
  const lvTop=T.lv>=4, fr=lvTop?1:(T.xp-XP_NEED[T.lv-1])/(XP_NEED[T.lv]-XP_NEED[T.lv-1]);
  info.innerHTML=gaugeHtml(T.type,T.lv,T)+towerTags(T.type,T)+
    `<div class="xpbar" style="--tc:${D.color}"><span class="gl">経験値</span><span class="bar"><i style="width:${Math.max(0,Math.min(1,fr))*100}%"></i></span><b>${lvTop?'MAX':'Lv'+(T.lv+1)+'へ'}</b></div>`;
  body.append(info);
  // ギミック：お店で解放したものを、この砲台につける（1つだけ。つけかえもできる）
  if(Object.keys(GIMMICKS).some(k=>G.gimmicks[k])){
    const h=document.createElement('h3'); h.textContent='ギミックをつける'; h.style.margin='4px 0 0'; body.append(h);
    for(const k of Object.keys(GIMMICKS)){
      const M=GIMMICKS[k]; if(!avail(M)&&T.gm!==k) continue;
      if(T.gm===k) body.append(itemRow(M.color,M.name,M.desc,'ついてる',false,null,true));
      else if(G.gimmicks[k]) body.append(itemRow(M.color,M.name,M.desc+(T.gm?'（いまのギミックと入れかえ）':''),M.cost,G.balls>=M.cost,()=>{
        G.balls-=M.cost; T.gm=k; T.bump=.25; T.sw=8; burst(p.x,p.y,'#e8f4ff',14); sfx.build(); closeSheet();
      }));
      else{const row=itemRow(M.color,M.name,'お店で手に入るよ','—',false);row.classList.add('locked');body.append(row)}
    }
  }else info.insertAdjacentHTML('beforeend','<p class="hint">お店で<b>ギミック</b>を買うと、この砲台につけられるよ</p>');
  $('sheet').hidden=false;
}
function closeSheet(){$('sheet').hidden=true;G.sel=null;G.paused=false}
$('sheetClose').onclick=()=>closeSheet();

cv.addEventListener('pointerdown',e=>{
  if(G.state!=='play'||G.paused) return;
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left-ox)/scale, y=(e.clientY-r.top-oy)/scale;
  let best=null,bd=Infinity;
  for(const p of G.pegs){if(p.fixed)continue;const d=(p.x-x)**2+(p.y-y)**2;if(d<(p.r+16)**2&&d<bd){bd=d;best=p}}
  if(!best) return;
  ensureAudio();
  best.tower?openInfo(best):openBuild(best);
});

/* ---------- ハンドル（強さだけ。玉はずっと出ている） ---------- */
// ダイヤルのまわりを指で回す（右回り＝強く）。まん中近くは向きがぶれるので、指を右・上へ動かした分でも変わる
const handle=$('handle'), dial=$('dial');
let drag=null;
const dialAng=e=>{const r=dial.getBoundingClientRect();return{a:Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2)),d:Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))}};
handle.addEventListener('pointerdown',e=>{
  e.preventDefault(); ensureAudio();
  try{handle.setPointerCapture(e.pointerId)}catch(_){}
  drag={...dialAng(e),x:e.clientX,y:e.clientY};
});
handle.addEventListener('pointermove',e=>{
  if(!drag) return;
  const n=dialAng(e);
  if(n.d>14&&drag.d>14){let da=n.a-drag.a;if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2;setStrength(G.strength+da/(Math.PI*1.5))}
  else setStrength(G.strength+((e.clientX-drag.x)-(e.clientY-drag.y))/160);
  drag={...n,x:e.clientX,y:e.clientY};
});
const endDrag=()=>{drag=null};
handle.addEventListener('pointerup',endDrag);
handle.addEventListener('pointercancel',endDrag);
handle.addEventListener('lostpointercapture',endDrag);
handle.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowDown'){setStrength(G.strength-.05);e.preventDefault()}
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){setStrength(G.strength+.05);e.preventDefault()}
});

$('mute').onclick=()=>{muted=!muted;$('mute').setAttribute('aria-pressed',String(!muted));$('mute').setAttribute('aria-label',muted?'音 OFF':'音 ON');if(!muted)ensureAudio()};
// スタート：セーブがあればそのつづき、なければはじめから。どちらも台えらびの画面へ
$('startBtn').onclick=()=>{ensureAudio();readSave()?continueRun():newRun()};

/* ---------- ループ ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  G.time+=dt;
  if(G.state==='play'&&!G.paused&&!document.hidden) update(dt);
  updateFx(dt);
  hud(); draw();
  requestAnimationFrame(loop);
}
setStrength(.5);
setupStage(); resize();
try{new ResizeObserver(resize).observe($('app'))}catch(_){window.addEventListener('resize',resize)}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(buildStatic).catch(()=>{});
requestAnimationFrame(t=>{last=t;loop(t)});
})();
</script>
